<style>
:root {
  --primary:      #0EA5A4;
  --primary-dark: #0F766E;
  --accent:       #F59E0B;
  --success:      #10B981;
  --warn:         #F97316;
  --ink:          #0F172A;
  --ink-soft:     #475569;
  --bg:           #FAFAFA;
  --bg-soft:      #F8FAFC;
  --border:       #E2E8F0;
  --radius:       12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 17px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
header {
  background: var(--primary-dark);
  color: white;
  padding: 0.9rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 1.2rem;
}
header a {
  color: rgba(255,255,255,0.85);
  text-decoration: none;
  font-size: 0.95rem;
  white-space: nowrap;
}
header a:hover { color: white; text-decoration: underline; }
header h1 {
  font-size: 1.15rem;
  font-weight: 700;
  color: white;
  line-height: 1.2;
}
#app {
  max-width: 680px;
  margin: 2rem auto;
  padding: 0 1rem 3rem;
}
.fortschritt-wrap {
  margin-bottom: 1.4rem;
}
.fortschritt-label {
  font-size: 0.88rem;
  color: var(--ink-soft);
  margin-bottom: 0.4rem;
}
.fortschritt-bar {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.fortschritt-fill {
  height: 100%;
  background: var(--primary);
  border-radius: 3px;
  transition: width 0.3s ease;
}
.karte {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.8rem;
  box-shadow: 0 4px 12px rgba(15,23,42,0.06);
}
.frage-text {
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 1.4rem;
  line-height: 1.45;
}
.optionen {
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
}
.option-btn {
  display: block;
  width: 100%;
  padding: 0.85rem 1.1rem;
  text-align: left;
  background: var(--bg-soft);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-family: inherit;
  font-size: 1rem;
  color: var(--ink);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  line-height: 1.4;
}
.option-btn:hover:not(:disabled) {
  background: #ECFEFF;
  border-color: var(--primary);
}
.option-btn:disabled { cursor: default; }
.option-btn.richtig {
  background: #DCFCE7;
  border-color: var(--success);
  color: #065F46;
  font-weight: 600;
}
.option-btn.falsch {
  background: #FFEDD5;
  border-color: var(--warn);
  color: #9A3412;
}
.erklaerung-box {
  margin-top: 1.2rem;
  background: var(--bg-soft);
  border-left: 4px solid var(--primary);
  border-radius: 8px;
  padding: 0.9rem 1.1rem;
  font-size: 0.97rem;
  color: var(--ink-soft);
  display: none;
}
.erklaerung-box.sichtbar { display: block; }
.erklaerung-label {
  font-weight: 700;
  color: var(--primary-dark);
  font-size: 0.9rem;
  margin-bottom: 0.35rem;
}
.weiter-btn {
  margin-top: 1.3rem;
  display: none;
  padding: 0.7rem 1.5rem;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 8px;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}
.weiter-btn.sichtbar { display: inline-block; }
.weiter-btn:hover { background: var(--primary-dark); transform: translateY(-1px); }
.ergebnis-karte {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 2.5rem 2rem;
  text-align: center;
  box-shadow: 0 4px 12px rgba(15,23,42,0.06);
}
.ergebnis-karte h2 {
  font-size: 1.6rem;
  color: var(--primary-dark);
  margin-bottom: 0.5rem;
}
.ergebnis-punkte {
  font-size: 3rem;
  font-weight: 800;
  color: var(--primary);
  margin: 0.6rem 0;
  line-height: 1;
}
.ergebnis-prozent {
  font-size: 1.3rem;
  color: var(--ink-soft);
  margin-bottom: 1.8rem;
}
.nochmal-btn {

  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;

}

<script>const QUIZ = [{"frage":"Private Haushalte stellen den Unternehmen Arbeitskraft zur Verfügung. Welcher Strom fließt dafür im Gegenzug von den Unternehmen zu den Haushalten?","optionen":["Güterstrom (Konsumgüter)","Geldstrom (Löhne und Gehälter)","Steuern an den Staat","Subventionen vom Staat"],"richtig":1,"erklaerung":"Für den Produktionsfaktor Arbeit zahlen Unternehmen Löhne und Gehälter — ein Geldstrom in Richtung der Haushalte."},{"frage":"Im einfachen Wirtschaftskreislauf fließen Konsumgüter von den Unternehmen zu den Haushalten. Welcher Strom fließt gleichzeitig in die entgegengesetzte Richtung?","optionen":["Faktorleistungen (Arbeit, Boden, Kapital)","Transferleistungen des Staates","Konsumausgaben der Haushalte","Ersparnisse der Haushalte"],"richtig":2,"erklaerung":"Die Haushalte zahlen für die erhaltenen Konsumgüter Konsumausgaben an die Unternehmen — ein Geldstrom in Gegenrichtung zum Güterstrom."},{"frage":"Welche der folgenden Aussagen über Geld- und Realströme im Wirtschaftskreislauf ist korrekt?","optionen":["Geld- und Realströme fließen stets in entgegengesetzten Richtungen.","Geld- und Realströme fließen stets in dieselbe Richtung.","Nur Geldströme existieren im modernen Wirtschaftskreislauf.","Realströme gibt es nur zwischen Haushalten und dem Staat."],"richtig":0,"erklaerung":"Im Wirtschaftskreislauf sind Geld- und Realströme gegenläufig: Wo Güter oder Faktoren hinfließen, fließt Geld in die entgegengesetzte Richtung."},{"frage":"Welche Produktionsfaktoren stellen Haushalte den Unternehmen im einfachen Wirtschaftskreislauf zur Verfügung?","optionen":["Konsumgüter, Dienstleistungen und Rohstoffe","Arbeit, Boden und Kapital","Steuern, Zinsen und Subventionen","Exportgüter, Importgüter und Devisen"],"richtig":1,"erklaerung":"Die klassischen volkswirtschaftlichen Produktionsfaktoren, die Haushalte den Unternehmen zur Verfügung stellen, sind Arbeit, Boden und Kapital."},{"frage":"Im erweiterten Wirtschaftskreislauf zahlt ein Haushalt Kfz-Steuer. Welche Art von Strom beschreibt dies am genauesten?","optionen":["Transferleistung vom Staat zum Haushalt","Subvention vom Staat an ein Unternehmen","Indirekte Steuer über ein Unternehmen zum Staat","Direkte Steuer vom Haushalt an den Staat"],"richtig":3,"erklaerung":"Die Kfz-Steuer ist eine direkte Steuer — sie wird direkt vom Haushalt an den Staat abgeführt, ohne den Umweg über ein Unternehmen."},{"frage":"Welche Zahlungen fließen im erweiterten Wirtschaftskreislauf vom Staat an die Haushalte?","optionen":["Direkte Steuern und Umsatzsteuer","Subventionen und Deckungskredite","Kindergeld, Sozialhilfe und Sparzulage (Transferleistungen)","Exporterlöse und Importausgaben"],"richtig":2,"erklaerung":"Der Staat zahlt Transferleistungen — wie Kindergeld, Sozialhilfe und Sparzulagen — an die Haushalte. Dies sind Geldströme vom Staat zu den Haushalten."},{"frage":"Eine Softwarefirma erhält eine staatliche Investitionszulage. Welcher Begriff beschreibt diesen Geldstrom im erweiterten Wirtschaftskreislauf korrekt?","optionen":["Subvention vom Staat an das Unternehmen","Transferleistung des Staates an einen Haushalt","Direkte Steuer vom Unternehmen an den Staat","Kredit der Banken an den Staat"],"richtig":0,"erklaerung":"Staatliche Zahlungen an Unternehmen zur Förderung von Investitionen oder Arbeitsplätzen nennt man Subventionen — ein Geldstrom vom Staat zu den Unternehmen."},{"frage":"Im erweiterten Wirtschaftskreislauf legt ein Haushalt 5 000 € bei einer Bank an. Welcher Strom fließt dabei von der Bank zum Haushalt?","optionen":["Konsumausgaben","Staatliche Transferleistungen","Exporterlöse aus dem Ausland","Zinszahlungen auf die Ersparnisse"],"richtig":3,"erklaerung":"Wenn Haushalte Geld bei Banken anlegen (Sparen), erhalten sie als Gegenleistung Zinszahlungen — ein Geldstrom von der Bank zum Haushalt."},{"frage":"Ein deutsches IT-Unternehmen exportiert Serverkomponenten nach Japan. Welcher Geldstrom entsteht dabei im erweiterten Wirtschaftskreislauf?","optionen":["Importausgaben fließen von Deutschland ins Ausland.","Exporterlöse fließen vom Ausland nach Deutschland.","Subventionen fließen vom Staat zum Unternehmen.","Steuern fließen vom Unternehmen an den Staat."],"richtig":1,"erklaerung":"Beim Export fließen Güter (Realstrom) von Deutschland ins Ausland; im Gegenzug fließen Exporterlöse (Geldstrom) vom Ausland nach Deutschland."},{"frage":"Deutschland gilt als exportstarkes Land. Welche Konsequenz hat ein hoher Exportüberschuss für den Geldstrom im erweiterten Wirtschaftskreislauf?","optionen":["Es fließt netto mehr Geld aus dem Ausland nach Deutschland als umgekehrt.","Es fließt netto mehr Geld von Deutschland ins Ausland als umgekehrt.","Die Geldströme zwischen Deutschland und dem Ausland sind stets ausgeglichen.","Exporterlöse verbleiben ausschließlich bei den Haushalten."],"richtig":0,"erklaerung":"Ein Exportüberschuss bedeutet, dass mehr Güter ins Ausland geliefert werden als importiert werden. Daher fließen netto mehr Exporterlöse (Geld) nach Deutschland als Importausgaben ins Ausland abfließen."},{"frage":"Welche Wirtschaftssubjekte sind im erweiterten Wirtschaftskreislauf zusätzlich zum einfachen Kreislauf (Haushalte und Unternehmen) enthalten?","optionen":["Nur Haushalte, Unternehmen und Finanzämter","Arbeitnehmer, Arbeitgeber und Vermittlungsstellen","Staat, Banken und Ausland","Ausland und Finanzämter"],"richtig":2,"erklaerung":"Der erweiterte Wirtschaftskreislauf ergänzt den einfachen Kreislauf um drei weitere Wirtschaftssubjekte: Staat, Banken und Ausland."},{"frage":"Eine Bank vergibt einen Kredit an ein IT-Startup für den Kauf neuer Server. Welcher Strom fließt dabei unmittelbar von der Bank zum IT-Startup?","optionen":["Geldstrom vom IT-Startup zur Bank (Kreditrückzahlung)","Realstrom in Form von Serverequipment","Geldstrom vom Staat zur Bank (Subvention)","Geldstrom von der Bank zum IT-Startup (Kreditauszahlung)"],"richtig":3,"erklaerung":"Bei der Kreditvergabe fließt der Kreditbetrag unmittelbar als Geldstrom von der Bank zum Unternehmen (IT-Startup). Die Rückzahlung mit Zinsen erfolgt zeitversetzt in umgekehrter Richtung."},{"frage":"Ein Unternehmen ist der einzige Anbieter eines Produkts auf dem Markt. Ihm stehen viele Nachfrager gegenüber. Welche Marktform liegt vor?","optionen":["Polypol","Angebotsoligopol","Angebotsmonopol","Nachfragemonopol"],"richtig":2,"erklaerung":"Ein einziger Anbieter und viele Nachfrager kennzeichnen das Angebotsmonopol. Der Monopolist hat erheblichen Einfluss auf den Preis."},{"frage":"Auf dem Markt für Smartphone-Betriebssysteme beherrschen Google (Android) und Apple (iOS) gemeinsam den Weltmarkt. Welche Marktform trifft am besten zu?","optionen":["Polypol mit vielen Anbietern","Angebotsoligopol mit wenigen Anbietern","Nachfragemonopol mit einem Nachfrager","Vollkommener Markt mit vollständiger Konkurrenz"],"richtig":1,"erklaerung":"Wenige Anbieter (Google und Apple) stehen einer großen Zahl von Nachfragern gegenüber — das ist ein Angebotsoligopol."},{"frage":"Auf welchem Markt handeln Unternehmen mit Produktionsfaktoren wie Arbeit, Boden und Kapital?","optionen":["Gütermarkt","Konsumgütermarkt","Faktorenmarkt","Wertpapiermarkt für Endverbraucher"],"richtig":2,"erklaerung":"Auf dem Faktorenmarkt werden Produktionsfaktoren (Arbeit, Boden, Kapital) gehandelt. Dazu gehören Arbeitsmarkt, Immobilienmarkt und Finanzmärkte."},{"frage":"Das Bundeskartellamt vermutet nach § 18 GWB eine marktbeherrschende Stellung, wenn ein Unternehmen mindestens wie viel Prozent Marktanteil hält?","optionen":["25 %","33 %","40 %","51 %"],"richtig":2,"erklaerung":"Gemäß § 18 Abs. 4 GWB wird eine marktbeherrschende Stellung vermutet, wenn ein Unternehmen mindestens 40 % Marktanteil hält. Das Bundeskartellamt muss dann tätig werden."},{"frage":"Auf dem Markt für Cloud-Infrastruktur dominieren AWS, Microsoft Azure und Google Cloud. Welche Marktform liegt vor?","optionen":["Polypol","Nachfrageoligopol","Zweiseitiges Monopol","Angebotsoligopol"],"richtig":3,"erklaerung":"Wenige Anbieter (AWS, Azure, Google) stehen vielen Nachfragern gegenüber — dies ist ein klassisches Angebotsoligopol."},{"frage":"Welche Bedingung ist für einen vollkommenen Markt NICHT erforderlich?","optionen":["Viele Anbieter und Nachfrager (vollkommene Konkurrenz)","Homogenität der angebotenen Güter","Vollständige Markttransparenz","Staatliche Preisfestsetzung durch Behörden"],"richtig":3,"erklaerung":"Im vollkommenen Markt bildet sich der Preis frei durch Angebot und Nachfrage — staatliche Preisfestsetzung ist kein Merkmal. Die anderen vier Bedingungen (viele Anbieter/Nachfrager, Homogenität, Transparenz, Präferenzlosigkeit und Anpassungsfähigkeit) sind dagegen kennzeichnend."},{"frage":"Im E-Commerce-Bereich beschreibt der Begriff B2C welche Transaktionsbeziehung?","optionen":["Business to Consumer — Unternehmen bieten Verbrauchern Produkte an","Business to Company — Unternehmen handeln untereinander","Browser to Customer — Onlineshopping über den Browser","Bank to Consumer — Banken bieten Privatpersonen Kredite an"],"richtig":0,"erklaerung":"B2C steht für Business-to-Consumer: Unternehmen bieten direkt an Endverbraucher Produkte und Dienstleistungen an, z. B. über Internetshops oder Newsletter."},{"frage":"Ein IT-Systemhaus ist der einzige Anbieter und eine Gemeinde ist der einzige Käufer seiner Netzwerktechnik-Leistung. Welche Marktform liegt vor?","optionen":["Angebotsmonopol","Nachfragemonopol","Zweiseitiges Monopol","Angebotsoligopol"],"richtig":2,"erklaerung":"Wenn genau ein Anbieter auf genau einen Nachfrager trifft, spricht man von einem zweiseitigen Monopol (bilaterales Monopol)."},{"frage":"Die Angebotskurve eines Marktes verläuft steigend. Was bedeutet das für das Verhalten der Anbieter?","optionen":["Mit steigendem Preis sinkt die angebotene Menge.","Mit steigendem Preis steigt die angebotene Menge.","Mit steigender Menge sinkt der Preis automatisch.","Der Preis hat keinen Einfluss auf die angebotene Menge."],"richtig":1,"erklaerung":"Die Angebotskurve verläuft steigend: Bei höheren Preisen lohnt sich für Anbieter eine höhere Produktion, daher steigt die angebotene Menge mit zunehmendem Preis."},{"frage":"Die Nachfragekurve eines Marktes verläuft fallend. Was bedeutet das für das Verhalten der Nachfrager?","optionen":["Mit steigendem Preis steigt die nachgefragte Menge.","Mit sinkendem Preis sinkt die nachgefragte Menge.","Mit steigendem Preis sinkt die nachgefragte Menge.","Der Preis hat keinen Einfluss auf die nachgefragte Menge."],"richtig":2,"erklaerung":"Die Nachfragekurve verläuft fallend: Je höher der Preis, desto weniger sind Verbraucher bereit zu kaufen — die nachgefragte Menge sinkt mit steigendem Preis."},{"frage":"Was kennzeichnet den Gleichgewichtspreis auf einem vollkommenen Markt?","optionen":["Die nachgefragte Menge ist größer als die angebotene Menge.","Angebotene und nachgefragte Menge sind gleich groß.","Der Staat legt diesen Preis per Gesetz fest.","Nur ein Anbieter kann diesen Preis bestimmen."],"richtig":1,"erklaerung":"Beim Gleichgewichtspreis (Schnittpunkt von Angebots- und Nachfragekurve) entspricht die angebotene Menge genau der nachgefragten Menge — weder Über- noch Unterversorgung."},{"frage":"Auf einem Computermarkt beträgt das Angebot bei 300 € nur 200 Stück, die Nachfrage jedoch 1 400 Stück. Wie nennt man diese Marktsituation?","optionen":["Angebotsüberhang mit Käufermarkt","Gleichgewicht — Angebot und Nachfrage sind ausgeglichen","Angebotsüberhang mit Verkäufermarkt","Nachfrageüberhang mit Verkäufermarkt"],"richtig":3,"erklaerung":"Da die Nachfrage (1 400 Stück) das Angebot (200 Stück) deutlich übersteigt, liegt ein Nachfrageüberhang vor. Dies entspricht einem Verkäufermarkt, auf dem die Anbieter den Preis erhöhen können."},{"frage":"Die Einkommen der Haushalte steigen spürbar. Wie verschiebt sich die Nachfragekurve auf dem Konsumgütermarkt dadurch typischerweise?","optionen":["Sie verschiebt sich nach links — die Nachfrage sinkt bei jedem Preis.","Sie bleibt unverändert — nur die Angebotskurve reagiert.","Sie verschiebt sich nach rechts — die Nachfrage steigt bei jedem Preis.","Sie wird steiler, bleibt aber an derselben Stelle."],"richtig":2,"erklaerung":"Steigende Einkommen erhöhen die Kaufkraft und damit die Nachfrage bei jedem gegebenen Preisniveau. Die Nachfragekurve verschiebt sich nach rechts — ein neuer, höherer Gleichgewichtspreis entsteht."},{"frage":"Die Produktionskosten für Halbleiterchips steigen stark an. Wie wirkt sich das auf die Angebotskurve des Chipmarktes aus?","optionen":["Die Angebotskurve verschiebt sich nach rechts — mehr Chips werden bei jedem Preis angeboten.","Die Angebotskurve verschiebt sich nach links — weniger Chips werden bei jedem Preis angeboten.","Die Angebotskurve bleibt unverändert, nur der Preis steigt.","Die Nachfragekurve verschiebt sich nach links, nicht die Angebotskurve."],"richtig":1,"erklaerung":"Höhere Produktionskosten machen die Herstellung bei jedem Preispunkt weniger rentabel. Die Angebotskurve verschiebt sich nach links — Anbieter bieten bei gleichem Preis weniger an, was den Gleichgewichtspreis erhöht."},{"frage":"Auf dem Markt für gebrauchte PCs gibt es ein sehr großes Angebot, aber kaum Käufer. Wie nennt man diese Marktsituation?","optionen":["Verkäufermarkt mit Nachfrageüberhang","Käufermarkt mit Angebotsüberhang","Zweiseitiges Monopol","Vollkommener Markt mit Gleichgewichtspreis"],"richtig":1,"erklaerung":"Wenn das Angebot größer ist als die Nachfrage, liegt ein Angebotsüberhang vor — dies ist ein Käufermarkt. Die Verkäufer müssen ihre Preise senken, um Käufer zu finden."},{"frage":"Bei einem Preis von 450 € werden auf einem Computermarkt genau 650 Stück angeboten und nachgefragt. Was gilt für diesen Markt bei einem Preis von 500 €?","optionen":["Es entsteht ein Angebotsüberhang — ein Käufermarkt.","Es entsteht ein Nachfrageüberhang — ein Verkäufermarkt.","Angebot und Nachfrage bleiben ausgeglichen.","Der Gleichgewichtspreis steigt automatisch auf 500 €."],"richtig":0,"erklaerung":"Bei 500 € liegt der Preis über dem Gleichgewichtspreis von 450 €. Anbieter bieten bei höherem Preis mehr an, Nachfrager kaufen weniger — es entsteht ein Angebotsüberhang (Käufermarkt)."},{"frage":"Was versteht man unter einem Verkäufermarkt in der IT-Branche?","optionen":["Das Angebot übersteigt die Nachfrage, Käufer haben Verhandlungsmacht.","Angebot und Nachfrage sind im Gleichgewicht.","Nur ein Anbieter bestimmt Angebot und Preis.","Die Nachfrage übersteigt das Angebot, Verkäufer können Preise erhöhen."],"richtig":3,"erklaerung":"Im Verkäufermarkt übersteigt die Nachfrage das Angebot. Verkäufer können höhere Preise durchsetzen. Ein IT-Beispiel: Engpässe im Chip-Markt führen zu einem Verkäufermarkt für Halbleiter."},{"frage":"Welche der folgenden Aussagen beschreibt korrekt, warum die Nachfragekurve im vollkommenen Markt fällt?","optionen":["Höhere Preise motivieren Anbieter, mehr zu produzieren.","Bei steigendem Preis sinkt die Kaufbereitschaft der Nachfrager, sodass weniger gekauft wird.","Höhere Preise führen zu mehr Wettbewerb unter Anbietern.","Der Staat greift bei hohen Preisen regulierend ein und senkt dadurch die Nachfrage."],"richtig":1,"erklaerung":"Die Nachfragekurve fällt, weil Nachfrager bei höheren Preisen weniger kaufen — das Gut wird relativ teurer im Vergleich zu Alternativen, die Kaufbereitschaft sinkt."},{"frage":"Warum hat Google im Suchmaschinenmarkt eine so dominante Stellung erlangt? Welche Eigenschaft von IT-Märkten erklärt dies am besten?","optionen":["Staatliche Regulierung hat Google bevorzugt.","Netzwerkeffekte: Mehr Nutzer verbessern den Algorithmus, was weitere Nutzer anzieht.","Google hält Patente auf alle grundlegenden Suchalgorithmen.","Der Suchmaschinenmarkt ist ein vollkommener Markt mit Polypol."],"richtig":1,"erklaerung":"Netzwerkeffekte erklären Googles Dominanz: Mehr Suchanfragen verbessern den Algorithmus, bessere Ergebnisse ziehen mehr Nutzer an, die wiederum mehr Daten liefern — ein sich selbst verstärkender Kreislauf."},{"frage":"Der Apple App Store ist die einzige offizielle Möglichkeit, Apps auf iPhones zu installieren. Welche Marktform bildet Apple damit auf diesem Teilmarkt?","optionen":["Polypol, weil es viele App-Entwickler gibt","Nachfrageoligopol, weil Apple nur einer von wenigen Abnehmern ist","Angebotsmonopol, weil Apple der einzige Anbieter dieses Distributionskanals ist","Vollkommener Markt, weil App-Preise transparent sind"],"richtig":2,"erklaerung":"Apple ist der einzige Anbieter des iOS App Stores als Distributionskanal — dies ist ein Angebotsmonopol auf diesem Teilmarkt. App-Entwickler müssen Apple eine Provision zahlen, da es keine Alternative gibt."},{"frage":"Was versteht man unter Plattformökonomie in IT-Märkten?","optionen":["Die ausschließliche Herstellung von Hardware-Plattformen","Ein Geschäftsmodell, bei dem ein Intermediär mehrere Marktteilnehmergruppen zusammenbringt","Den staatlichen Betrieb von IT-Infrastrukturen","Die kostenlose Bereitstellung von Betriebssystemen"],"richtig":1,"erklaerung":"Plattformökonomie bezeichnet Geschäftsmodelle, bei denen ein Unternehmen als Vermittler (Intermediär) zwei oder mehr Gruppen von Marktteilnehmern zusammenbringt — z. B. Amazon Marketplace verbindet Händler und Käufer."},{"frage":"Was sind Lock-in-Effekte in IT-Märkten, und wie wirken sie sich auf den Wettbewerb aus?","optionen":["Sie entstehen durch hohe Wechselkosten und verringern die Wettbewerbsintensität.","Sie erleichtern den Wechsel zwischen Anbietern und fördern den Wettbewerb.","Sie sind gesetzlich vorgeschrieben und schützen Verbraucher.","Sie treten ausschließlich auf staatlich regulierten Märkten auf."],"richtig":0,"erklaerung":"Lock-in-Effekte entstehen, wenn der Wechsel zu einem anderen Anbieter mit hohen Kosten verbunden ist — z. B. durch proprietäre Dateiformate oder eingebettete Daten. Dies schwächt den Wettbewerb, da Kunden auch bei schlechterem Angebot beim Anbieter bleiben."},{"frage":"Der Chipmarkt wird von wenigen Herstellern wie Intel, AMD und Qualcomm dominiert. Welche typische Verhaltensweise ergibt sich aus dieser Marktform für die Anbieter?","optionen":["Anbieter können Preise völlig unabhängig voneinander setzen (Polypol).","Ein einziger Anbieter bestimmt allein den Marktpreis (Monopol).","Staatliche Behörden legen den Preis per Regulierung fest.","Anbieter beobachten sich gegenseitig und reagieren auf Preisänderungen (Oligopol)."],"richtig":3,"erklaerung":"Im Angebotsoligopol stehen wenige Anbieter vielen Nachfragern gegenüber. Die Anbieter reagieren aufeinander: Senkt ein Anbieter den Preis, müssen andere folgen. Dies ist typisches Oligopolverhalten im Chipmarkt."},{"frage":"Welches Ziel verfolgt der EU Digital Markets Act (DMA) in Bezug auf IT-Märkte?","optionen":["Den Wettbewerb sichern, indem Gatekeeper-Plattformen zu Interoperabilität und fairem Verhalten verpflichtet werden.","Ausschließlich europäische IT-Unternehmen gegenüber US-Konzernen zu fördern.","Für alle IT-Produkte staatliche Höchstpreise festzulegen.","Plattformgeschäftsmodelle grundsätzlich zu verbieten."],"richtig":0,"erklaerung":"Der Digital Markets Act (DMA) der EU verpflichtet große Plattformbetreiber (Gatekeeper) zu offenem Zugang, Interoperabilität und dem Verbot bestimmter Self-preferencing-Praktiken — mit dem Ziel, fairen Wettbewerb zu sichern."},{"frage":"Das Finanzamt bucht die Lohn- und Einkommensteuer vom Konto eines Arbeitnehmers ab. Welche Art von Strom beschreibt dies im erweiterten Wirtschaftskreislauf?","optionen":["Realstrom vom Haushalt zum Staat","Subvention — Geldstrom vom Staat zum Haushalt","Indirekte Steuer — Geldstrom vom Unternehmen zum Staat","Direkte Steuer — Geldstrom vom Haushalt zum Staat"],"richtig":3,"erklaerung":"Lohn- und Einkommensteuer wird direkt vom Einkommen des Haushalts erhoben und an den Staat abgeführt. Es handelt sich um eine direkte Steuer — ein Geldstrom vom Haushalt zum Staat."},{"frage":"Immer mehr Unternehmen steigen auf Cloud-Dienste um. Die Nachfrage nach eigenen physischen Serverräumen nimmt stark ab. Wie verändert sich die Nachfragekurve für Serverraum-Infrastruktur?","optionen":["Sie verschiebt sich nach rechts — die Nachfrage steigt bei jedem Preis.","Sie verschiebt sich nach links — die Nachfrage sinkt bei jedem Preis.","Nur die Angebotskurve verschiebt sich; die Nachfrage bleibt konstant.","Der Gleichgewichtspreis steigt automatisch durch den Strukturwandel."],"richtig":1,"erklaerung":"Durch den Strukturwandel hin zur Cloud-Nutzung sinkt die Nachfrage nach eigenen Serverräumen bei jedem Preisniveau. Die Nachfragekurve verschiebt sich nach links — der Gleichgewichtspreis für Serverraum-Infrastruktur fällt."},{"frage":"Ein Fachinformatiker arbeitet als Freelancer und bietet Netzwerk-Support an. Auf dem Markt gibt es 200 weitere Freelancer mit ähnlichem Angebot und tausende Auftraggeber. Welche Marktform liegt vor?","optionen":["Angebotsmonopol — der Freelancer kann den Preis frei bestimmen","Angebotsoligopol — wenige Freelancer dominieren und beobachten sich gegenseitig","Nachfragemonopol — ein einziger Auftraggeber bestimmt den Preis","Polypol — der Preis entsteht durch Angebot und Nachfrage, kein Einzelner bestimmt ihn"],"richtig":3,"erklaerung":"Viele Anbieter (200 Freelancer) und viele Nachfrager (tausende Auftraggeber) kennzeichnen ein Polypol. Der Preis entsteht durch freies Angebot und Nachfrage — kein Einzelner hat Preisstärke."},{"frage":"Ein IT-Systemhaus kauft für seine Mitarbeiter neue Laptops beim Hersteller. Welche E-Commerce-Transaktionsbeziehung trifft hier zu, und welche Marktstruktur ist auf der Anbieterseite typisch?","optionen":["C2C — Verbraucher kaufen von Verbrauchern; Polypol","B2B — Unternehmen kauft bei einem anderen Unternehmen; oft Oligopol auf Anbieterseite","B2C — Unternehmen verkauft an Verbraucher; Polypol auf Nachfragerseite","A2B — Behörde schreibt an Unternehmen aus; Nachfragemonopol"],"richtig":1,"erklaerung":"Ein IT-Systemhaus (Unternehmen) kauft bei einem Laptop-Hersteller (Unternehmen) — das ist eine B2B-Transaktionsbeziehung. Der Laptop-Markt ist auf der Anbieterseite typischerweise ein Oligopol (wenige große Hersteller wie Lenovo, HP, Dell)."}];

(function() {
  var fragen = [];
  var aktuell = 0;
  var richtigCount = 0;
  var app = document.getElementById('app');

  function mischen(arr) {
    // Fisher-Yates in-place
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function fragenVorbereiten() {
    // Kopie der Original-Fragen
    var kopie = QUIZ.map(function(f) { return Object.assign({}, f, { optionen: f.optionen.slice() }); });
    mischen(kopie);

    fragen = kopie.map(function(f) {
      // Optionen mischen, korrekten Index mitführen
      var n = f.optionen.length;
      var indizes = [];
      for (var k = 0; k < n; k++) indizes.push(k);
      // Fisher-Yates auf Indizes
      for (var i = n - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = indizes[i]; indizes[i] = indizes[j]; indizes[j] = tmp;
      }
      // neues Optionen-Array in gemischter Reihenfolge
      var gemischteOptionen = indizes.map(function(idx) { return f.optionen[idx]; });
      // neuer Index der richtigen Antwort
      var neuerRichtig = indizes.indexOf(f.richtig);
      return {
        frage: f.frage,
        optionen: gemischteOptionen,
        richtig: neuerRichtig,
        erklaerung: f.erklaerung
      };
    });
  }

  function start() {
    aktuell = 0;
    richtigCount = 0;
    fragenVorbereiten();
    zeigeFrage();
  }

  function zeigeFrage() {
    if (aktuell >= fragen.length) {
      zeigeErgebnis();
      return;
    }
    var f = fragen[aktuell];
    var prozent = Math.round((aktuell / fragen.length) * 100);

    var html = '<div class="fortschritt-wrap">'
      + '<div class="fortschritt-label">Frage ' + (aktuell + 1) + ' von ' + fragen.length + '</div>'
      + '<div class="fortschritt-bar"><div class="fortschritt-fill" style="width:' + prozent + '%"></div></div>'
      + '</div>'
      + '<div class="karte">'
      + '<div class="frage-text">' + escHtml(f.frage) + '</div>'
      + '<div class="optionen">';

    f.optionen.forEach(function(opt, idx) {
      html += '<button class="option-btn" data-idx="' + idx + '">' + escHtml(opt) + '</button>';
    });

    html += '</div>'
      + '<div class="erklaerung-box" id="erklaerung">'
      + '<div class="erklaerung-label">Erklärung</div>'
      + '<div id="erklaerung-text"></div>'
      + '</div>'
      + '<button class="weiter-btn" id="weiter-btn">'
      + (aktuell + 1 < fragen.length ? 'Weiter →' : 'Auswertung')
      + '</button>'
      + '</div>';

    app.innerHTML = html;

    // Event-Listener auf Buttons
    var btns = app.querySelectorAll('.option-btn');
    btns.forEach(function(btn) {
      btn.addEventListener('click', function() {
        var gewaehlt = parseInt(btn.getAttribute('data-idx'));
        antwortenVerarbeiten(gewaehlt, btns);
      });
    });

    document.getElementById('weiter-btn').addEventListener('click', function() {
      aktuell++;
      zeigeFrage();
    });
  }

  function antwortenVerarbeiten(gewaehlt, btns) {
    var f = fragen[aktuell];
    var richtigIdx = f.richtig;

    // Alle Buttons deaktivieren
    btns.forEach(function(b) { b.disabled = true; });

    // Gewählte Option einfärben
    if (gewaehlt === richtigIdx) {
      btns[gewaehlt].classList.add('richtig');
      richtigCount++;
    } else {
      btns[gewaehlt].classList.add('falsch');
      btns[richtigIdx].classList.add('richtig');
    }

    // Erklärung anzeigen
    var erkBox = document.getElementById('erklaerung');
    var erkText = document.getElementById('erklaerung-text');
    erkText.textContent = f.erklaerung;
    erkBox.classList.add('sichtbar');

    // Weiter-Button anzeigen
    document.getElementById('weiter-btn').classList.add('sichtbar');
  }

  function zeigeErgebnis() {
    var gesamt = fragen.length;
    var prozent = Math.round((richtigCount / gesamt) * 100);
    var bewertung = prozent >= 80 ? '🎉 Sehr gut!' : prozent >= 60 ? '👍 Gut gemacht!' : '💪 Weiter üben!';

    app.innerHTML = '<div class="ergebnis-karte">'
      + '<h2>Auswertung</h2>'
      + '<div class="ergebnis-punkte">' + richtigCount + ' / ' + gesamt + '</div>'
      + '<div class="ergebnis-prozent">' + prozent + ' % richtig — ' + bewertung + '</div>'
      + '<button class="nochmal-btn" id="nochmal-btn">Nochmal</button>'
      + '</div>';

    document.getElementById('nochmal-btn').addEventListener('click', start);
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  start();
})();
</script></body></html>
