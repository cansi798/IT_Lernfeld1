<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lernbereich · Session 8 — Präsentieren, Feedback & Gesamtwiederholung</title>
<style>
:root {
  --primary:      #0EA5A4;
  --primary-dark: #0F766E;
  --accent:       #F59E0B;
  --success:      #10B981;
  --warn:         #F97316;
  --ink:          #0F172A;
  --ink-soft:     #475569;
  --bg:           #FAFAFA;
  --bg-soft:      #F8FAFC;
  --border:       #E2E8F0;
  --radius:       12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 17px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
header {
  background: var(--primary-dark);
  color: white;
  padding: 0.9rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 1.2rem;
}
header a {
  color: rgba(255,255,255,0.85);
  text-decoration: none;
  font-size: 0.95rem;
  white-space: nowrap;
}
header a:hover { color: white; text-decoration: underline; }
header h1 {
  font-size: 1.15rem;
  font-weight: 700;
  color: white;
  line-height: 1.2;
  flex: 1;
}
#toolbar {
  max-width: 800px;
  margin: 1.4rem auto 0;
  padding: 0 1rem;
  display: flex;
  justify-content: flex-end;
}
.loeschen-btn {
  padding: 0.45rem 1rem;
  background: transparent;
  border: 1.5px solid var(--warn);
  border-radius: 8px;
  font-family: inherit;
  font-size: 0.88rem;
  color: var(--warn);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.loeschen-btn:hover { background: #FFEDD5; color: #9A3412; }
#app {
  max-width: 800px;
  margin: 1.2rem auto;
  padding: 0 1rem 3rem;
  display: flex;
  flex-direction: column;
  gap: 1.4rem;
}
.aufgabe-karte {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.8rem;
  box-shadow: 0 4px 12px rgba(15,23,42,0.06);
}
.aufgabe-kopf {
  display: flex;
  align-items: flex-start;
  gap: 0.9rem;
  margin-bottom: 1.1rem;
}
.aufgabe-titel {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--ink);
  flex: 1;
  line-height: 1.35;
}
.punkte-badge {
  background: var(--primary);
  color: white;
  font-size: 0.78rem;
  font-weight: 700;
  padding: 0.25rem 0.6rem;
  border-radius: 20px;
  white-space: nowrap;
  flex-shrink: 0;
  margin-top: 0.1rem;
}
.aufgaben-text {
  color: var(--ink);
  font-size: 1rem;
  line-height: 1.6;
  margin-bottom: 1.2rem;
}
.aufgaben-text p { margin-bottom: 0.6em; }
.aufgaben-text p:last-child { margin-bottom: 0; }
.aufgaben-text ul, .aufgaben-text ol {
  padding-left: 1.5em;
  margin-bottom: 0.6em;
}
.aufgaben-text li { margin-bottom: 0.3em; }
.aufgaben-text table {
  border-collapse: collapse;
  width: 100%;
  margin-bottom: 0.8em;
  font-size: 0.95rem;
}
.aufgaben-text th, .aufgaben-text td {
  border: 1px solid var(--border);
  padding: 0.4rem 0.7rem;
  text-align: left;
}
.aufgaben-text th { background: var(--bg-soft); font-weight: 600; }
.antwort-label {
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--ink-soft);
  margin-bottom: 0.4rem;
}
.antwort-textarea {
  width: 100%;
  min-height: 9rem;
  padding: 0.75rem 1rem;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-family: inherit;
  font-size: 1rem;
  color: var(--ink);
  background: var(--bg-soft);
  resize: vertical;
  transition: border-color 0.15s, box-shadow 0.15s;
  line-height: 1.5;
}
.antwort-textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(14,165,164,0.15);
  background: white;
}
.hinweis-btn {
  margin-top: 1rem;
  padding: 0.55rem 1.1rem;
  background: transparent;
  border: 1.5px solid var(--success);
  border-radius: 8px;
  font-family: inherit;
  font-size: 0.92rem;
  font-weight: 600;
  color: #065F46;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.hinweis-btn:hover { background: #DCFCE7; }
.musterloesung-box {
  display: none;
  margin-top: 1rem;
  background: #F0FDF4;
  border: 1.5px solid #86EFAC;
  border-radius: 10px;
  padding: 1rem 1.2rem;
}
.musterloesung-box.sichtbar { display: block; }
.musterloesung-label {
  font-size: 0.85rem;
  font-weight: 700;
  color: #065F46;
  margin-bottom: 0.5rem;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.musterloesung-inhalt {
  font-size: 0.97rem;
  color: #14532D;
  line-height: 1.6;
}
.musterloesung-inhalt p { margin-bottom: 0.5em; }
.musterloesung-inhalt p:last-child { margin-bottom: 0; }
.musterloesung-inhalt ul, .musterloesung-inhalt ol {
  padding-left: 1.5em;
  margin-bottom: 0.5em;
}
.musterloesung-inhalt li { margin-bottom: 0.25em; }
.musterloesung-inhalt table {
  border-collapse: collapse;
  width: 100%;
  margin-bottom: 0.6em;
  font-size: 0.93rem;
}
.musterloesung-inhalt th, .musterloesung-inhalt td {
  border: 1px solid #86EFAC;
  padding: 0.35rem 0.6rem;
  text-align: left;
}
.musterloesung-inhalt th { background: #DCFCE7; font-weight: 600; }
.autosave-info {
  font-size: 0.78rem;
  color: var(--ink-soft);
  margin-top: 0.35rem;
  height: 1.1em;
}
</style></head>
<body>
<header>
  <a href="../index.html">← Kursübersicht</a>
  <h1>Lernbereich · Session 8 — Präsentieren, Feedback & Gesamtwiederholung</h1>
</header>
<div id="toolbar">
  <button class="loeschen-btn" id="alle-loeschen-btn">Alle Eingaben löschen</button>
</div>
<main id="app"></main>
<script>
var AUFGABEN = [{"nr":1,"titel":"Beobachtung und Feedback geben","punkte":10,"aufgabentext":"<p><strong>Kontext:</strong> Sie sind Auszubildende bei der <strong>JIKU IT-Solutions GmbH</strong> in Hamburg. Heute führen die Teams ihre vorbereiteten Betriebspräsentationen durch, geben gegenseitig Feedback und wiederholen abschließend den gesamten Stoff des Lernfeldes 1.</p><ol type='a'><li><strong>Beobachten</strong> Sie während der Präsentation einer Mitschülergruppe die Vortragstechnik. Wählen Sie <strong>zwei Beobachtungsschwerpunkte</strong> aus: Blickkontakt, Lautstärke und Artikulation, Körperhaltung, Pausen und Tempo, Umgang mit Lampenfieber. Notieren Sie zu jedem Schwerpunkt <strong>mindestens zwei konkrete Beobachtungen</strong> (was genau haben Sie wahrgenommen?). Formulieren Sie nur Beschreibungen — keine Bewertungen. <em>(6 P.)</em></li><li><strong>Formulieren</strong> Sie auf Basis Ihrer Beobachtungen <strong>ein konstruktives Feedback</strong> (mindestens vier Sätze) an die präsentierende Gruppe. Beachten Sie: konkret, beschreibend, als Ich-Botschaft, mit Positivem beginnen, nur auf Veränderbares beziehen. <em>(4 P.)</em></li></ol>","loesung":"<p><strong>(a)</strong> Beobachtungen sollen konkret und beschreibend sein — keine Urteile. Beispiel Blickkontakt: &bdquo;Die Vortragenden haben während der ersten drei Minuten überwiegend auf die Folie geschaut&rdquo; statt &bdquo;Sie hatten schlechten Blickkontakt.&rdquo; Akzeptiert werden alle Beobachtungen, die eine wahrnehmbare Handlung beschreiben.</p><p><strong>(b)</strong> Musterstruktur: (1) Mit Positivem beginnen: Ich-Botschaft über eine Stärke. (2) Zweite Stärke benennen. (3) Konkrete Beobachtung zu einem Verbesserungsbereich: &bdquo;Ich habe bemerkt, dass …&rdquo; (4) Konkreter Verbesserungsvorschlag. Alle vier Feedbacksätze müssen als Ich-Botschaften formuliert sein.</p>"},{"nr":2,"titel":"Reflexion der Teamarbeit","punkte":8,"aufgabentext":"<p>Beantworten Sie die folgenden Reflexionsfragen zur eigenen Betriebspräsentation in vollständigen Sätzen.</p><ol type='a'><li>Was ist Ihrer Gruppe bei der Vorbereitung und Durchführung besonders gut gelungen? Nennen Sie mindestens zwei konkrete Aspekte. <em>(2 P.)</em></li><li>Was lief weniger gut, und welche Ursache vermuten Sie dafür? <em>(2 P.)</em></li><li>Was würden Sie beim nächsten Präsentationsprojekt konkret anders machen? Formulieren Sie eine SMART-Maßnahme (was genau, wer, bis wann). <em>(2 P.)</em></li><li>Welche Reflexionsmethode würden Sie für eine strukturierte Teamauswertung einsetzen — Blitzlicht oder Spinnennetz? Begründen Sie Ihre Wahl. <em>(2 P.)</em></li></ol>","loesung":"<p><strong>(a)</strong> Beispiele: Gute Aufgabenverteilung, klarer Aufbau, Probevortrag durchgeführt.</p><p><strong>(b)</strong> Beispiele: Zeitplanung unterschätzt, zu viel Text auf Folien, fehlende Abstimmung.</p><p><strong>(c)</strong> SMART-Beispiel: &bdquo;Wir halten bis zur nächsten Präsentation in drei Wochen einen Probevortrag vor der Klasse — Verantwortlich: alle Gruppenmitglieder.&rdquo;</p><p><strong>(d)</strong> Blitzlicht: schnell, für kurze Zeitfenster. Spinnennetz: differenzierter, für Mehrkriterien-Bewertung auf Skala. Beide Antworten akzeptabel bei überzeugender Begründung.</p>"},{"nr":3,"titel":"Präsentationsbewertung","punkte":8,"aufgabentext":"<ol type='a'><li><strong>Nennen</strong> Sie die vier Bewertungsbereiche eines typischen Präsentations-Bewertungsbogens und die jeweilige Gewichtung. <em>(4 P.)</em></li><li><strong>Erläutern</strong> Sie, welchen Mehrwert der Vergleich von Selbst- und Fremdbewertung nach einer Präsentation hat. <em>(2 P.)</em></li><li>Warum muss ein Bewertungsbogen <strong>vor</strong> der Präsentation verteilt werden, nicht erst danach? <em>(2 P.)</em></li></ol>","loesung":"<p><strong>(a)</strong> Fachlicher Inhalt 40 %, Struktur 20 %, Medien und Folien 20 %, Vortragsstil 20 %.</p><p><strong>(b)</strong> Blinde Flecken sichtbar machen: eigene Stärken werden manchmal unterschätzt, Schwächen nicht erkannt. Nur durch Gegenüberstellung wird Reflexion möglich.</p><p><strong>(c)</strong> Alle Beurteilenden nutzen dieselben Maßstäbe; die Vortragenden können sich gezielt vorbereiten; Willkür in der Beurteilung wird verhindert.</p>"},{"nr":4,"titel":"Gesamtwiederholung Ausbildungsrecht","punkte":12,"aufgabentext":"<p><strong>Ordnen</strong> Sie die folgenden Aussagen dem richtigen Gesetz und Paragrafen zu.</p><table><tr><th>Aussage</th><th>Gesetz und Paragraph</th></tr><tr><td>(a) Die Probezeit beträgt mindestens 1 und höchstens 4 Monate.</td><td></td></tr><tr><td>(b) Jugendliche dürfen täglich nicht mehr als 8 Stunden beschäftigt werden.</td><td></td></tr><tr><td>(c) Die Firma ist der Name, unter dem ein Kaufmann seine Geschäfte betreibt.</td><td></td></tr><tr><td>(d) Das Mindest-Stammkapital der GmbH beträgt 25.000 €.</td><td></td></tr><tr><td>(e) Der Ausbildungsvertrag muss schriftlich niedergelegt und bei der IHK eingereicht werden.</td><td></td></tr><tr><td>(f) Die JAV ist die gewählte Interessenvertretung der Jugendlichen und Auszubildenden.</td><td></td></tr></table>","loesung":"<ul><li>(a) § 20 BBiG — Probezeit.</li><li>(b) § 8 JArbSchG — tägliche Arbeitszeit.</li><li>(c) § 17 HGB — Firma.</li><li>(d) § 5 GmbHG — Mindeststammkapital.</li><li>(e) § 11 BBiG — Vertragsniederschrift.</li><li>(f) § 70 BetrVG — JAV.</li></ul>"},{"nr":5,"titel":"Wertschöpfungsrechnung und Marktanalyse","punkte":12,"aufgabentext":"<p>JIKU Hamburg erzielt im laufenden Jahr Nettoumsatzerlöse von 4,8 Mio. €. Vorleistungen (eingekaufte Hardware und Fremdleistungen) belaufen sich auf 1,9 Mio. €, Abschreibungen auf 0,3 Mio. €. Am Hamburger Standort arbeiten 52 Mitarbeiter.</p><ol type='a'><li><strong>Berechnen</strong> Sie die Wertschöpfung. <em>(2 P.)</em></li><li><strong>Berechnen</strong> Sie die Wertschöpfung je Mitarbeiter. <em>(2 P.)</em></li><li><strong>Erläutern</strong> Sie, an welche vier Gruppen die Wertschöpfung verteilt wird. <em>(4 P.)</em></li><li>Der Cloud-Infrastrukturmarkt wird von drei großen Anbietern (AWS, Microsoft Azure, Google Cloud) beherrscht. <strong>Benennen</strong> Sie die Marktform und beschreiben Sie ein typisches Merkmal dieses Markttyps. <em>(4 P.)</em></li></ol>","loesung":"<p><strong>(a)</strong> Wertschöpfung = 4.800.000 € − 1.900.000 € − 300.000 € = <strong>2.600.000 €</strong>.</p><p><strong>(b)</strong> Wertschöpfung je MA = 2.600.000 € ÷ 52 = <strong>50.000 €</strong>.</p><p><strong>(c)</strong> Verteilung an: Mitarbeiter (Löhne/Gehälter), Fremdkapitalgeber (Zinsen), Staat (Steuern und Abgaben), Eigenkapitalgeber (Gewinn/Dividende).</p><p><strong>(d)</strong> <strong>Angebotsoligopol</strong>: wenige Anbieter (AWS, Azure, Google Cloud) stehen vielen Nachfragern gegenüber. Typisches Merkmal: gegenseitige Beobachtung der Wettbewerber, Preisreaktionen aufeinander abgestimmt, starke Marktmacht der wenigen Anbieter.</p>"},{"nr":6,"titel":"Fallaufgabe Ausbildungsrecht bei JIKU","punkte":10,"aufgabentext":"<p>Lena (17 Jahre) beginnt ihre Ausbildung zur Fachinformatikerin bei JIKU Hamburg. Ihr Ausbilder plant folgendes Vorgehen:</p><ul><li>Lena soll täglich von 8:00 bis 17:30 Uhr arbeiten (9,5 Stunden täglich).</li><li>Sie soll 24 Urlaubstage pro Jahr erhalten.</li><li>Der Ausbildungsvertrag soll erst nach zwei Wochen bei der IHK eingereicht werden.</li></ul><ol type='a'><li>Welche der drei geplanten Regelungen verstoßen gegen geltendes Recht? Nennen Sie jeweils das Gesetz und den Paragrafen sowie die richtige Regelung. <em>(6 P.)</em></li><li>Was versteht man unter der gestreckten Abschlussprüfung der IT-Berufe, und wie wird sie gewichtet? <em>(4 P.)</em></li></ol>","loesung":"<p><strong>(a)</strong> Drei Verstöße:</p><ol><li>9,5 h täglich: Verstoß gegen § 8 JArbSchG — max. 8 h täglich für Personen unter 18 Jahren.</li><li>24 Urlaubstage: Verstoß gegen § 19 JArbSchG — Lena ist 17 (noch nicht 18), daher mindestens 25 Werktage.</li><li>Verspätete IHK-Einreichung: Verstoß gegen § 11 Abs. 4 BBiG — unverzüglich einzureichen.</li></ol><p><strong>(b)</strong> Die gestreckte Abschlussprüfung besteht aus zwei Teilen: Teil 1 (ca. Mitte der Ausbildung) zählt <strong>20 %</strong> der Gesamtnote; Teil 2 (am Ende der Ausbildung) zählt <strong>80 %</strong> der Gesamtnote. Teil 2 umfasst bei Fachinformatikern u. a. die Projektarbeit und das Fachgespräch.</p>"}];
var SESSION_NR = '8';

(function() {
  var app = document.getElementById('app');

  function lsKey(nr) {
    return 'lernbereich_s' + SESSION_NR + '_aufgabe_' + nr;
  }

  function renderAufgaben() {
    var html = '';
    for (var i = 0; i < AUFGABEN.length; i++) {
      var a = AUFGABEN[i];
      var savedVal = localStorage.getItem(lsKey(a.nr)) || '';
      var safeVal = savedVal
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
      html += '<div class="aufgabe-karte" id="aufgabe-' + a.nr + '">'
        + '<div class="aufgabe-kopf">'
        + '<div class="aufgabe-titel">Aufgabe ' + escHtml(String(a.nr)) + ' — ' + escHtml(a.titel) + '</div>'
        + '<span class="punkte-badge">' + escHtml(String(a.punkte)) + ' P.</span>'
        + '</div>'
        + '<div class="aufgaben-text">' + a.aufgabentext + '</div>'
        + '<div class="antwort-label">Meine Antwort</div>'
        + '<textarea class="antwort-textarea" rows="6" data-nr="' + a.nr + '" placeholder="Schreiben Sie Ihre Antwort hier …">' + safeVal + '</textarea>'
        + '<div class="autosave-info" id="save-info-' + a.nr + '"></div>'
        + '<button class="hinweis-btn" data-nr="' + a.nr + '">Lösungshinweis anzeigen</button>'
        + '<div class="musterloesung-box" id="musterloesung-' + a.nr + '">'
        + '<div class="musterloesung-label">Musterlösung</div>'
        + '<div class="musterloesung-inhalt">' + a.loesung + '</div>'
        + '</div>'
        + '</div>';
    }
    app.innerHTML = html;

    // Textareas: autosave on input
    var textareas = app.querySelectorAll('.antwort-textarea');
    for (var j = 0; j < textareas.length; j++) {
      textareas[j].addEventListener('input', onTextareaInput);
    }

    // Toggle-Buttons
    var hinweisBtns = app.querySelectorAll('.hinweis-btn');
    for (var k = 0; k < hinweisBtns.length; k++) {
      hinweisBtns[k].addEventListener('click', onHinweisToggle);
    }
  }

  function onTextareaInput(evt) {
    var ta = evt.currentTarget;
    var nr = ta.getAttribute('data-nr');
    localStorage.setItem(lsKey(nr), ta.value);
    var info = document.getElementById('save-info-' + nr);
    if (info) {
      info.textContent = 'Gespeichert.';
      setTimeout(function() { if (info) info.textContent = ''; }, 1500);
    }
  }

  function onHinweisToggle(evt) {
    var btn = evt.currentTarget;
    var nr = btn.getAttribute('data-nr');
    var box = document.getElementById('musterloesung-' + nr);
    if (!box) return;
    var sichtbar = box.classList.contains('sichtbar');
    if (sichtbar) {
      box.classList.remove('sichtbar');
      btn.textContent = 'Lösungshinweis anzeigen';
    } else {
      box.classList.add('sichtbar');
      btn.textContent = 'Lösungshinweis verbergen';
    }
  }

  document.getElementById('alle-loeschen-btn').addEventListener('click', function() {
    if (!confirm('Wirklich alle Eingaben löschen? Diese Aktion kann nicht rückgängig gemacht werden.')) return;
    for (var i = 0; i < AUFGABEN.length; i++) {
      localStorage.removeItem(lsKey(AUFGABEN[i].nr));
    }
    var textareas = app.querySelectorAll('.antwort-textarea');
    for (var j = 0; j < textareas.length; j++) {
      textareas[j].value = '';
    }
  });

  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  renderAufgaben();
})();
</script>
</body></html>
