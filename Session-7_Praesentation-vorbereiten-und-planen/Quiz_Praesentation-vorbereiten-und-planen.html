<style>
:root {
  --primary:      #0EA5A4;
  --primary-dark: #0F766E;
  --accent:       #F59E0B;
  --success:      #10B981;
  --warn:         #F97316;
  --ink:          #0F172A;
  --ink-soft:     #475569;
  --bg:           #FAFAFA;
  --bg-soft:      #F8FAFC;
  --border:       #E2E8F0;
  --radius:       12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 17px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
header {
  background: var(--primary-dark);
  color: white;
  padding: 0.9rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 1.2rem;
}
header a {
  color: rgba(255,255,255,0.85);
  text-decoration: none;
  font-size: 0.95rem;
  white-space: nowrap;
}
header a:hover { color: white; text-decoration: underline; }
header h1 {
  font-size: 1.15rem;
  font-weight: 700;
  color: white;
  line-height: 1.2;
}
#app {
  max-width: 680px;
  margin: 2rem auto;
  padding: 0 1rem 3rem;
}
.fortschritt-wrap {
  margin-bottom: 1.4rem;
}
.fortschritt-label {
  font-size: 0.88rem;
  color: var(--ink-soft);
  margin-bottom: 0.4rem;
}
.fortschritt-bar {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.fortschritt-fill {
  height: 100%;
  background: var(--primary);
  border-radius: 3px;
  transition: width 0.3s ease;
}
.karte {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.8rem;
  box-shadow: 0 4px 12px rgba(15,23,42,0.06);
}
.frage-text {
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 1.4rem;
  line-height: 1.45;
}
.optionen {
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
}
.option-btn {
  display: block;
  width: 100%;
  padding: 0.85rem 1.1rem;
  text-align: left;
  background: var(--bg-soft);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-family: inherit;
  font-size: 1rem;
  color: var(--ink);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  line-height: 1.4;
}
.option-btn:hover:not(:disabled) {
  background: #ECFEFF;
  border-color: var(--primary);
}
.option-btn:disabled { cursor: default; }
.option-btn.richtig {
  background: #DCFCE7;
  border-color: var(--success);
  color: #065F46;
  font-weight: 600;
}
.option-btn.falsch {
  background: #FFEDD5;
  border-color: var(--warn);
  color: #9A3412;
}
.erklaerung-box {
  margin-top: 1.2rem;
  background: var(--bg-soft);
  border-left: 4px solid var(--primary);
  border-radius: 8px;
  padding: 0.9rem 1.1rem;
  font-size: 0.97rem;
  color: var(--ink-soft);
  display: none;
}
.erklaerung-box.sichtbar { display: block; }
.erklaerung-label {
  font-weight: 700;
  color: var(--primary-dark);
  font-size: 0.9rem;
  margin-bottom: 0.35rem;
}
.weiter-btn {
  margin-top: 1.3rem;
  display: none;
  padding: 0.7rem 1.5rem;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 8px;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}
.weiter-btn.sichtbar { display: inline-block; }
.weiter-btn:hover { background: var(--primary-dark); transform: translateY(-1px); }
.ergebnis-karte {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 2.5rem 2rem;
  text-align: center;
  box-shadow: 0 4px 12px rgba(15,23,42,0.06);
}
.ergebnis-karte h2 {
  font-size: 1.6rem;
  color: var(--primary-dark);
  margin-bottom: 0.5rem;
}
.ergebnis-punkte {
  font-size: 3rem;
  font-weight: 800;
  color: var(--primary);
  margin: 0.6rem 0;
  line-height: 1;
}
.ergebnis-prozent {
  font-size: 1.3rem;
  color: var(--ink-soft);
  margin-bottom: 1.8rem;
}
.nochmal-btn {

  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  font-family: inherit;
  font-size: 1.05rem;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}
.nochmal-btn:hover { background: #D97706; transform: translateY(-1px); }

<script>const QUIZ = [{"frage":"Welche Teamgröße gilt laut Lehrbuch als optimal für kreative und intensive Gruppenarbeit?","optionen":["5 bis 8 Personen","2 bis 3 Personen","10 bis 15 Personen","Beliebig viele Personen"],"richtig":0,"erklaerung":"Das Lehrbuch (Kap. 1.5.1) nennt 5 bis 8 Personen als optimale Teamgröße — bei dieser Größe entstehen die wenigsten Reibungsverluste und die schnellsten Einigungen."},{"frage":"Was versteht man unter 'sozialem Faulenzen' im Teamkontext?","optionen":["Das bewusste Verlangsamen der Arbeit, um die Teamdynamik zu beobachten","Das Ausruhen auf Kosten anderer Teammitglieder, ohne volle Leistung zu erbringen","Das Einhalten von Pausen zur Konzentrationssteigerung","Das gemeinsame Delegieren von Aufgaben an externe Fachkräfte"],"richtig":1,"erklaerung":"Soziales Faulenzen beschreibt das Phänomen, dass einzelne Teammitglieder ihre Leistung reduzieren und auf Kosten anderer arbeiten. Das gefährdet den Projekterfolg, weil Leistungsträger ihr Engagement ebenfalls verringern."},{"frage":"Welche Phase folgt im Tuckman-Phasenmodell auf die Storming-Phase?","optionen":["Forming","Adjourning","Norming","Performing"],"richtig":2,"erklaerung":"Im Tuckman-Modell lautet die Reihenfolge: Forming → Storming → Norming → Performing → Adjourning. Nach der Storming-Phase folgt die Regelungs- und Übereinkommensphase (Norming)."},{"frage":"Was ist die Hauptaufgabe einer Projektleitung im Präsentationsteam?","optionen":["Alle Folien selbst erstellen und gestalten","Den Gesamtüberblick behalten, moderieren und das Team führen","Ausschließlich die Recherche übernehmen","Das Handout drucken und verteilen"],"richtig":1,"erklaerung":"Die Projektleitung übernimmt Gesamtverantwortung, behält das große Ganze im Blick, moderiert Besprechungen und trifft bei Uneinigkeit Entscheidungen — sie ist nicht für alle Einzelaufgaben zuständig."},{"frage":"Was kennzeichnet die Performing-Phase im Tuckman-Modell?","optionen":["Unterschwellige Konflikte und Cliquenbildung prägen das Team","Das Team löst sich auf und das Projekt wird beendet","Alle Mitglieder sind höflich, aber noch vorsichtig","Das Team arbeitet zielorientiert, kooperativ, ideenreich und produktiv zusammen"],"richtig":3,"erklaerung":"In der Performing-Phase arbeitet das Team laut Tuckman zielorientiert, flexibel, ideenreich und produktiv; Wertschätzung und kooperativer Umgang prägen die Zusammenarbeit."},{"frage":"Welchen Zweck haben Sitzungen für Zwischenberichte in der IPERKA-Methode?","optionen":["Sie ermöglichen es, Fortschritte zu kontrollieren und rechtzeitig zu korrigieren","Sie ersetzen den abschließenden Bewertungsbogen","Sie werden nur erstellt, wenn das Team scheitert","Sie dokumentieren ausschließlich die Reisekosten des Teams"],"richtig":0,"erklaerung":"Im IPERKA-Rahmen (Planen) werden Sitzungen für Zwischenberichte eingeplant; sie ermöglichen dem Team und dem Auftraggeber, den Fortschritt zu kontrollieren und rechtzeitig zu korrigieren."},{"frage":"Warum sind heterogene Teams laut Lehrbuch für Projektarbeit besser geeignet als homogene Teams?","optionen":["Weil sie keine Konflikte erzeugen","Weil alle Mitglieder gleiche Aufgaben übernehmen können","Weil unterschiedliche Qualifikationen und Persönlichkeiten neue Ideen hervorbringen","Weil sie schneller Entscheidungen treffen als homogene Teams"],"richtig":2,"erklaerung":"Homogene Teams bringen kaum neue Ideen hervor. Heterogene Teams mit unterschiedlichen fachlichen und persönlichen Qualifikationen sind laut Lehrbuch (Kap. 1.5.1) für komplexe Aufgaben besser geeignet."},{"frage":"In welcher IPERKA-Phase wird festgelegt, wer die Projektleitung übernimmt?","optionen":["Realisieren","Kontrollieren","Auswerten","Entscheiden"],"richtig":3,"erklaerung":"Laut Lehrbuch wird in der Entscheiden-Phase (E in IPERKA) festgelegt, welcher Arbeits- und Maßnahmenplan umgesetzt wird und wer die Leitung (Federführung) übernimmt."},{"frage":"Was gehört an den Anfang der Präsentationsplanung?","optionen":["Die Auswahl der Schriftart","Die Analyse von Zielgruppe und Präsentationsziel","Das Erstellen der letzten Folie","Die Generalprobe"],"richtig":1,"erklaerung":"Erst wenn Ziel und Zielgruppe klar sind, lassen sich Inhalte, Tiefe und Medien sinnvoll festlegen — alles andere folgt danach."},{"frage":"Welche Frage ist bei der Zielgruppenanalyse besonders wichtig für die inhaltliche Tiefe der Präsentation?","optionen":["Welche Schriftart bevorzugt die Zielgruppe?","Wie viele Folien sind in anderen Präsentationen üblich?","Welche Vorkenntnisse haben die Zuhörer zum Thema?","Welches Logo soll auf der Titelfolie erscheinen?"],"richtig":2,"erklaerung":"Die Vorkenntnisse der Zuhörer bestimmen, wie tief und fachlich eine Präsentation angelegt sein muss. Ohne diese Information riskiert man, am Publikum vorbeizureden."},{"frage":"Welche Rahmenbedingung muss bei der Planung einer Präsentation geklärt werden?","optionen":["Die Lieblingsfarbe der Referierenden","Wie viel Zeit für Aufbau, Vortrag und Abschlussgespräch zur Verfügung steht","Welche anderen Präsentationen in der Vergangenheit gehalten wurden","Die Herkunft der Zuhörer"],"richtig":1,"erklaerung":"Zu den Rahmenbedingungen zählen laut Lehrbuch (Kap. 1.5.2): Zeit (inkl. Aufbau, Einleitung, Schlussgespräch), Kosten, Vorkenntnisse, Interessen, Raumausstattung und gewünschte Unterlagen."},{"frage":"Wofür steht die Abkürzung KISS bei der Stoffauswahl für Präsentationen?","optionen":["Keep It Short and Simple","Keep Interesting, Stay Simple","Knowledge Is Structural System","Keep Inhalte Structured and Smart"],"richtig":0,"erklaerung":"KISS steht für 'Keep It Short and Simple' — halte es kurz und einfach. Diese Regel erinnert daran, Inhalte auf das Wesentliche zu verdichten und verständlich zu formulieren."},{"frage":"Was besagt die 10-20-30-Regel für Folien-Präsentationen?","optionen":["10 Bilder, 20 Stichpunkte, 30 Sekunden pro Folie","Maximal 10 Folien, maximal 20 Minuten, Schrift mindestens 30 Punkt","10 Minuten Vorbereitung, 20 Minuten Vortrag, 30 Sekunden Zusammenfassung","10 Zuhörer, 20 Seiten Handout, 30 Punkte im Bewertungsbogen"],"richtig":1,"erklaerung":"Die 10-20-30-Regel lautet: nicht mehr als 10 Folien, nicht mehr als 20 Minuten Vortragsdauer, keine Schrift kleiner als 30 Punkt — so bleibt die Präsentation kompakt und lesbar."},{"frage":"Welche Leitfrage hilft bei der Stoffauswahl für eine Präsentation?","optionen":["Welche Inhalte füllen die meisten Folien?","Welche Informationen sind am schwierigsten zu recherchieren?","Was hat die Klasse beim letzten Mal präsentiert?","Ist der Inhalt für die Zuhörer interessant und wichtig für das Ziel?"],"richtig":3,"erklaerung":"Laut Lehrbuch (Kap. 1.5.2) sind zentrale Leitfragen: Passt es zum Thema? Ist es wichtig für das Ziel? Ist es interessant für die Teilnehmer? Können Fakten reduziert werden?"},{"frage":"Welcher Aspekt der Rahmenbedingungen betrifft die Frage, ob Teilnehmer ein Handout erhalten?","optionen":["Zeit","Kosten","Raum","Unterlagen"],"richtig":3,"erklaerung":"Die Kategorie 'Unterlagen' umfasst laut Lehrbuch: welche Unterlagen bereitgestellt werden (Handout, Dateien, Feedbackbogen), ob ein Protokoll gewünscht wird und ob Teilnehmer vorab Informationen erhalten."},{"frage":"Welches sachlogische Aufbauprinzip beginnt mit dem Gesamtbild und arbeitet sich dann zum Detail vor?","optionen":["Vom Problem zur Problemlösung","Vom Bekannten zum Unbekannten","Vom Allgemeinen zum Besonderen","Vom Leichten zum Schweren"],"richtig":2,"erklaerung":"'Vom Allgemeinen zum Besonderen' beginnt mit dem Gesamtbild und arbeitet sich schrittweise zu spezifischeren Details vor. Laut Lehrbuch (Kap. 1.5.2) ist das eines der empfohlenen sachlogischen Aufbauprinzipien."},{"frage":"Was ist die Funktion eines Storyboards bei der Präsentationsvorbereitung?","optionen":["Es ersetzt den Probevortrag und spart Zeit","Es zeigt alle Folien in der geplanten Reihenfolge und prüft den logischen Aufbau","Es enthält ausschließlich die Bilder und Grafiken der Präsentation","Es ist das abschließende Reflexionsdokument nach der Präsentation"],"richtig":1,"erklaerung":"Ein Storyboard ist eine Skizze aller Folien in der geplanten Reihenfolge. Es hilft dem Team, den logischen Aufbau und den roten Faden zu prüfen — bevor aufwändig Folien gestaltet werden."},{"frage":"Welcher Teil einer Präsentation bleibt beim Publikum am längsten in Erinnerung?","optionen":["Der Hauptteil, weil er am ausführlichsten ist","Der Mittelteil, weil er die meisten Fakten enthält","Die Animationen auf den Folien","Die ersten und die letzten Sätze"],"richtig":3,"erklaerung":"Laut Lehrbuch (Kap. 1.5.2) bleiben die ersten und die letzten Sätze beim Publikum am längsten in Erinnerung — deshalb sollten Einstieg und Schluss besonders sorgfältig vorbereitet werden."},{"frage":"Welchen Anteil sollte der Einstieg einer Präsentation typischerweise einnehmen?","optionen":["Etwa 40 bis 50 Prozent der Gesamtzeit","Etwa 10 bis 15 Prozent der Gesamtzeit","Genau 30 Prozent der Gesamtzeit","Etwa 70 Prozent der Gesamtzeit"],"richtig":1,"erklaerung":"Als Faustregel gilt: Einstieg ca. 10–15 % der Gesamtzeit, Hauptteil ca. 70–75 %, Schluss ca. 10–15 %. Der Einstieg soll Interesse wecken, aber nicht die Hauptaussagen vorwegnehmen."},{"frage":"Was gehört zu den Aufgaben des Einstiegs einer Präsentation?","optionen":["Alle Details des Themas vollständig erklären","Die Bewertungskriterien für die Zuhörer verlesen","Interesse wecken, das Thema nennen und einen Überblick über die Struktur geben","Die Quellenliste und alle Fundstellen präsentieren"],"richtig":2,"erklaerung":"Der Einstieg hat die Aufgabe, das Publikum zu gewinnen, das Thema zu nennen und einen Orientierungsrahmen zu geben — nicht, bereits alle Inhalte zu präsentieren."},{"frage":"Was bedeutet 'roter Faden' in einer Präsentation?","optionen":["Ein rotes Designelement auf jeder Folie für die visuelle Einheitlichkeit","Die Nummerierung aller Folien in aufsteigender Reihenfolge","Ein farbiges Inhaltsverzeichnis am Anfang der Präsentation","Ein erkennbarer inhaltlicher Zusammenhang zwischen allen Teilen der Präsentation"],"richtig":3,"erklaerung":"Der rote Faden bezeichnet den erkennbaren inhaltlichen Zusammenhang, der alle Teile verbindet — jede Folie knüpft an die vorherige an und bereitet die nächste vor, sodass die Zuhörer dem Vortrag folgen können."},{"frage":"Welche Aufgabe hat der Schluss einer Präsentation?","optionen":["Neue, bisher nicht erwähnte Informationen einführen","Die längsten und detailliertesten Beispiele präsentieren","Zusammenfassen, ein Fazit ziehen und einen Ausblick geben","Einen neuen Themenkomplex für die nächste Präsentation ankündigen"],"richtig":2,"erklaerung":"Der Schluss fasst die Kernaussagen zusammen, zieht ein Fazit und gibt gegebenenfalls einen Ausblick. Er sollte keine neuen, unvorbereiteten Informationen enthalten, da die letzten Sätze besonders im Gedächtnis bleiben."},{"frage":"Welche Methode kann bei der Stoffsammlung für eine Präsentation eingesetzt werden?","optionen":["Nur Internetrecherche ist zulässig","Ausschließlich das Lehrbuch darf als Quelle genutzt werden","Nur Bilder und Videos, da Texte zu aufwändig zu recherchieren sind","Brainstorming, Vor-Ort-Recherche, Befragungen, Statistiken und Fachbuchrecherche"],"richtig":3,"erklaerung":"Laut Lehrbuch (Kap. 1.5.2) stehen viele Methoden zur Stoffsammlung zur Verfügung: Brainstorming, Vor-Ort-Recherche, Befragungen, Internetrecherche, Fachbuchrecherche, Bibliotheken, Statistiken, Videos und Grafiken."},{"frage":"Welche Aussage zum Aufbau des Hauptteils einer Präsentation ist korrekt?","optionen":["Im Hauptteil werden alle Themen in beliebiger Reihenfolge vorgestellt","Im Hauptteil spielt die Reihenfolge keine Rolle, da Zuhörer den Zusammenhang selbst herstellen","Der Hauptteil beginnt immer mit dem schwierigsten und endet mit dem einfachsten Thema","Der Hauptteil sollte sachlogisch aufgebaut sein und einen Spannungsbogen halten"],"richtig":3,"erklaerung":"Laut Lehrbuch sollte der Hauptteil sachlogisch vorgehen, den Spannungsbogen halten und verständlich aufgebaut sein — zum Beispiel vom Allgemeinen zum Besonderen oder vom Leichten zum Schweren."},{"frage":"Was ist laut 10-20-30-Regel die Mindestschriftgröße auf einer Präsentationsfolie?","optionen":["12 Punkt","20 Punkt","30 Punkt","48 Punkt"],"richtig":2,"erklaerung":"Die 10-20-30-Regel schreibt vor: keine Schrift kleiner als 30 Punkt — damit sind Folieninhalte auch von den hinteren Reihen des Raumes noch gut lesbar."},{"frage":"Welches Visualisierungsmedium eignet sich besonders für spontane Ergänzungen während eines Vortrags?","optionen":["Flipchart oder Pinnwand","Beamer-Präsentation","Vorab aufgezeichnetes Video","Ausgedrucktes Handout für die Teilnehmer"],"richtig":0,"erklaerung":"Flipchart und Pinnwand eignen sich besonders für spontane Ergänzungen und interaktive Elemente, weil sie flexibel und ohne technische Vorkenntnisse nutzbar sind."},{"frage":"Wie hoch ist die Behaltensquote laut Lehrbuch, wenn Lernende hören, sehen, darüber sprechen und selbst handeln?","optionen":["20 Prozent","50 Prozent","70 Prozent","90 Prozent"],"richtig":3,"erklaerung":"Laut Lehrbuch (Kap. 1.5.2) gibt es fünf Stufen: Nur Hören 20 %, nur Sehen 30 %, Hören + Sehen 50 %, Hören + Sehen + darüber sprechen 70 %, Hören + Sehen + sprechen + selber tun 90 %. Die höchste Stufe (alle vier Aktivitäten) ergibt 90 %."},{"frage":"Welche Aussage zur Medienwahl für Präsentationen ist korrekt?","optionen":["Je mehr verschiedene Medien eingesetzt werden, desto besser die Präsentation","Medien sollen bewusst und sparsam eingesetzt werden — jedes braucht einen klaren Zweck","Für alle Präsentationen ist der Beamer die einzig akzeptable Wahl","Flipcharts sind nur für Grundschüler geeignet"],"richtig":1,"erklaerung":"Laut Lehrbuch (Kap. 1.5.2) sollte man nicht zu viele verschiedene Medien einsetzen — jedes Medium muss einen klaren Zweck erfüllen und zur Zielgruppe sowie den Rahmenbedingungen passen."},{"frage":"Welche Foliengestaltungsregel betrifft den Kontrast zwischen Schrift und Hintergrund?","optionen":["Schrift und Hintergrund sollten möglichst die gleiche Farbe haben, um ein ruhiges Bild zu erzeugen","Dunkle Schrift auf hellem Hintergrund oder helle Schrift auf dunklem Hintergrund sorgt für Lesbarkeit","Kontrast spielt bei Folien keine Rolle, da der Text laut vorgelesen wird","Kontrast ist nur bei gedruckten Handouts wichtig, nicht bei Bildschirmfolien"],"richtig":1,"erklaerung":"Guter Kontrast ist eine zentrale Gestaltungsregel: dunkle Schrift auf hellem Hintergrund oder helle Schrift auf dunklem Hintergrund gewährleistet Lesbarkeit auch bei schlechter Raumbeleuchtung."},{"frage":"Wie viele Stichpunkte pro Folie gelten als Richtwert für eine übersichtliche Gestaltung?","optionen":["Maximal 2","Maximal 5 bis 7","Maximal 15","Unbegrenzt, solange die Schrift klein genug ist"],"richtig":1,"erklaerung":"Als Richtwert gelten maximal 5 bis 7 Stichpunkte pro Folie. Mehr Punkte überfordern das Publikum und verleiten dazu, die Folie zu lesen statt zuzuhören — Schlüsselworte statt vollständiger Sätze verwenden."},{"frage":"Welchen Vorteil bietet ein Handout gegenüber der alleinigen Beamer-Präsentation?","optionen":["Es bleibt nach der Präsentation bei den Teilnehmern und ermöglicht das Nachlesen","Es kann mehr Bilder anzeigen als eine digitale Präsentation","Es ist billiger zu erstellen als Folien am Computer","Es ersetzt den mündlichen Vortrag vollständig"],"richtig":0,"erklaerung":"Ein Handout bleibt nach der Präsentation bei den Teilnehmern und ermöglicht ihnen, Inhalte nachzulesen und zu vertiefen. Außerdem ist es technologieunabhängig und funktioniert ohne Strom oder Geräte."},{"frage":"Welches Diagramm eignet sich am besten, um Anteile eines Ganzen darzustellen?","optionen":["Liniendiagramm","Balkendiagramm","Streudiagramm","Kreisdiagramm"],"richtig":3,"erklaerung":"Ein Kreisdiagramm (Tortendiagramm) eignet sich besonders gut, um Anteile eines Ganzen zu visualisieren. Balkendiagramme eignen sich für Vergleiche, Liniendiagramme für Trends über die Zeit."},{"frage":"Anna soll die JIKU IT-Solutions GmbH vor Mitschülerinnen ohne IT-Kenntnisse vorstellen. Was sollte sie besonders beachten?","optionen":["Möglichst viele Fachbegriffe einsetzen, um kompetent zu wirken","Eine sehr lange Präsentation mit 30 Folien vorbereiten","Fachbegriffe erklären oder vermeiden und den Inhalt verständlich aufbereiten","Die gesamte Unternehmensgeschichte seit der Gründung erzählen"],"richtig":2,"erklaerung":"Bei Zuhörern ohne IT-Kenntnisse ist es entscheidend, Fachbegriffe zu erklären oder zu vermeiden und den Inhalt auf das Verständlichste zu beschränken — gemäß der KISS-Regel."},{"frage":"Das Team hat noch fünf Stunden bis zur Präsentation. Welche Maßnahme hat höchste Priorität?","optionen":["Neue Inhalte recherchieren und in die Folien einfügen","Den Hintergrund aller Folien neu gestalten","Das Handout ins Englische übersetzen","Einen vollständigen Probevortrag halten und die Zeitvorgabe prüfen"],"richtig":3,"erklaerung":"Kurz vor der Präsentation hat ein vollständiger Probevortrag höchste Priorität — er deckt Schwächen auf, prüft die Zeitvorgabe und steigert die Sicherheit. Inhaltliche Ergänzungen in letzter Minute bergen das Risiko neuer Fehler."},{"frage":"Lars soll als Projektleiter die Aufgaben im Team verteilen. Welcher Fehler wäre besonders kritisch?","optionen":["Er wählt für jede Aufgabe die Person mit den passenden Stärken aus","Er gibt alle Aufgaben an eine einzige Person, um Reibungsverluste zu vermeiden","Er klärt mit dem Team die Bewertungskriterien der Präsentation","Er plant einen Puffer für unvorhergesehene Probleme ein"],"richtig":1,"erklaerung":"Alle Aufgaben einer Person zu übertragen widerspricht dem Sinn von Teamarbeit, überlastet das Mitglied und gefährdet den Projekterfolg. Die Projektleitung muss Aufgaben so verteilen, dass alle Mitglieder einbezogen werden."},{"frage":"Eine Folie enthält einen vollständigen Absatz mit 15 Sätzen in Schriftgröße 12. Was ist das Hauptproblem?","optionen":["Die Folie hat zu wenige Bilder","Die Schrift ist zu klein und der Text zu lang — beides verletzt grundlegende Gestaltungsregeln","Die Hintergrundfarbe ist falsch gewählt","Es fehlt ein Titelbalken oben auf der Folie"],"richtig":1,"erklaerung":"Schriftgröße 12 verletzt die 10-20-30-Regel (Mindestgröße 30 Punkt), und 15 Sätze Fließtext widersprechen der Empfehlung von maximal 5–7 Stichpunkten. Beides führt dazu, dass die Folie unlesbar und überfrachtet wirkt."},{"frage":"Welches Vorgehen entspricht der empfohlenen Reihenfolge bei der Präsentationsvorbereitung?","optionen":["Erst Folien gestalten, dann Zielgruppe und Ziel analysieren","Erst Generalprobe, dann Storyboard, dann Stoffsammlung","Erst Ziel und Zielgruppe klären, dann Stoff sammeln, dann strukturieren, dann Folien erstellen","Erst Handout drucken, dann Vortrag halten, dann Reflexion"],"richtig":2,"erklaerung":"Die empfohlene Reihenfolge lautet: Ziel und Zielgruppe klären → Rahmenbedingungen prüfen → Stoff sammeln → strukturieren (Storyboard) → Folien erstellen → Generalprobe → Reflexion."},{"frage":"Saahil stellt fest, dass Julian kaum etwas zur Gruppenarbeit beiträgt. Was sollte Saahil tun?","optionen":["Julians Aufgaben still übernehmen, ohne ihn anzusprechen","Das Problem beim Projektleiter ansprechen, damit Aufgaben klarer verteilt werden","Die gesamte Gruppe auflösen und alleine weiterarbeiten","Julian aus dem Team ausschließen und sofort den Lehrer informieren"],"richtig":1,"erklaerung":"Soziales Faulenzen gefährdet den Projekterfolg. Der richtige Weg ist, das Problem beim Projektleiter anzusprechen — dieser kann für klarere Aufgabenverteilung und Transparenz sorgen, ohne das Team zu spalten."},{"frage":"Für eine Präsentation vor dem IHK-Prüfungsausschuss sind maximal drei Folien vorgesehen. Was wählt man am sinnvollsten?","optionen":["Eine detaillierte Unternehmensgeschichte, alle Mitarbeiternamen und die vollständige Preisliste","Firmentitel und Kurzportrait, Kerngeschäftsfelder sowie Ausbildungsangebot","Eine leere Titelfolie, ein Organigramm und eine Folie über die Konkurrenz","Ausschließlich Bilder ohne Text, damit die Folie nicht überladen wirkt"],"richtig":1,"erklaerung":"Bei maximal drei Folien und ca. zwei Minuten Vortrag ist scharfe Auswahl entscheidend: Firmentitel und Kurzportrait geben Orientierung, Kerngeschäftsfelder zeigen die Leistungen, das Ausbildungsangebot ist für den Prüfungskontext besonders relevant."},{"frage":"Das Team stellt kurz vor der Präsentation fest, dass kein Beamer verfügbar ist. Was wäre jetzt am sinnvollsten?","optionen":["Die Präsentation ersatzlos absagen","Die Präsentation trotzdem mit dem Laptop halten und alle Zuhörer um einen kleinen Tisch bitten","Flexibel auf das Flipchart oder ausgedruckte Handouts umsteigen und den Vortrag anpassen","Einen neuen Termin vereinbaren und die Präsentation vollständig neu erstellen"],"richtig":2,"erklaerung":"Flexibilität ist eine wichtige Kompetenz: Bei fehlendem Beamer kann man auf Flipchart oder ausgedruckte Handouts ausweichen und den Vortrag anpassen. Das zeigt Professionalität und Problemlösefähigkeit."}];

(function() {
  var fragen = [];
  var aktuell = 0;
  var richtigCount = 0;
  var app = document.getElementById('app');

  function mischen(arr) {
    // Fisher-Yates in-place
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function fragenVorbereiten() {
    // Kopie der Original-Fragen
    var kopie = QUIZ.map(function(f) { return Object.assign({}, f, { optionen: f.optionen.slice() }); });
    mischen(kopie);

    fragen = kopie.map(function(f) {
      // Optionen mischen, korrekten Index mitführen
      var n = f.optionen.length;
      var indizes = [];
      for (var k = 0; k < n; k++) indizes.push(k);
      // Fisher-Yates auf Indizes
      for (var i = n - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = indizes[i]; indizes[i] = indizes[j]; indizes[j] = tmp;
      }
      // neues Optionen-Array in gemischter Reihenfolge
      var gemischteOptionen = indizes.map(function(idx) { return f.optionen[idx]; });
      // neuer Index der richtigen Antwort
      var neuerRichtig = indizes.indexOf(f.richtig);
      return {
        frage: f.frage,
        optionen: gemischteOptionen,
        richtig: neuerRichtig,
        erklaerung: f.erklaerung
      };
    });
  }

  function start() {
    aktuell = 0;
    richtigCount = 0;
    fragenVorbereiten();
    zeigeFrage();
  }

  function zeigeFrage() {
    if (aktuell >= fragen.length) {
      zeigeErgebnis();
      return;
    }
    var f = fragen[aktuell];
    var prozent = Math.round((aktuell / fragen.length) * 100);

    var html = '<div class="fortschritt-wrap">'
      + '<div class="fortschritt-label">Frage ' + (aktuell + 1) + ' von ' + fragen.length + '</div>'
      + '<div class="fortschritt-bar"><div class="fortschritt-fill" style="width:' + prozent + '%"></div></div>'
      + '</div>'
      + '<div class="karte">'
      + '<div class="frage-text">' + escHtml(f.frage) + '</div>'
      + '<div class="optionen">';

    f.optionen.forEach(function(opt, idx) {
      html += '<button class="option-btn" data-idx="' + idx + '">' + escHtml(opt) + '</button>';
    });

    html += '</div>'
      + '<div class="erklaerung-box" id="erklaerung">'
      + '<div class="erklaerung-label">Erklärung</div>'
      + '<div id="erklaerung-text"></div>'
      + '</div>'
      + '<button class="weiter-btn" id="weiter-btn">'
      + (aktuell + 1 < fragen.length ? 'Weiter →' : 'Auswertung')
      + '</button>'
      + '</div>';

    app.innerHTML = html;

    // Event-Listener auf Buttons
    var btns = app.querySelectorAll('.option-btn');
    btns.forEach(function(btn) {
      btn.addEventListener('click', function() {
        var gewaehlt = parseInt(btn.getAttribute('data-idx'));
        antwortenVerarbeiten(gewaehlt, btns);
      });
    });

    document.getElementById('weiter-btn').addEventListener('click', function() {
      aktuell++;
      zeigeFrage();
    });
  }

  function antwortenVerarbeiten(gewaehlt, btns) {
    var f = fragen[aktuell];
    var richtigIdx = f.richtig;

    // Alle Buttons deaktivieren
    btns.forEach(function(b) { b.disabled = true; });

    // Gewählte Option einfärben
    if (gewaehlt === richtigIdx) {
      btns[gewaehlt].classList.add('richtig');
      richtigCount++;
    } else {
      btns[gewaehlt].classList.add('falsch');
      btns[richtigIdx].classList.add('richtig');
    }

    // Erklärung anzeigen
    var erkBox = document.getElementById('erklaerung');
    var erkText = document.getElementById('erklaerung-text');
    erkText.textContent = f.erklaerung;
    erkBox.classList.add('sichtbar');

    // Weiter-Button anzeigen
    document.getElementById('weiter-btn').classList.add('sichtbar');
  }

  function zeigeErgebnis() {
    var gesamt = fragen.length;
    var prozent = Math.round((richtigCount / gesamt) * 100);
    var bewertung = prozent >= 80 ? '🎉 Sehr gut!' : prozent >= 60 ? '👍 Gut gemacht!' : '💪 Weiter üben!';

    app.innerHTML = '<div class="ergebnis-karte">'
      + '<h2>Auswertung</h2>'
      + '<div class="ergebnis-punkte">' + richtigCount + ' / ' + gesamt + '</div>'
      + '<div class="ergebnis-prozent">' + prozent + ' % richtig — ' + bewertung + '</div>'
      + '<button class="nochmal-btn" id="nochmal-btn">Nochmal</button>'
      + '</div>';

    document.getElementById('nochmal-btn').addEventListener('click', start);
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  start();
})();
</script></body></html>
