<style>
:root {
  --primary:      #0EA5A4;

}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {

}
header {
  background: var(--primary-dark);

}
header a {
  color: rgba(255,255,255,0.85);

  white-space: nowrap;
}
header a:hover { color: white; text-decoration: underline; }

  font-size: 1.15rem;
  font-weight: 700;
  color: white;
  line-height: 1.2;
}

  max-width: 680px;
  margin: 2rem auto;

}
.fortschritt-wrap {

}

  font-size: 0.88rem;

  margin-bottom: 0.4rem;
}
.fortschritt-bar {
  height: 6px;
  background: var(--border);

}

  height: 100%;
  background: var(--primary);

}

  border-radius: var(--radius);

}

  font-size: 1.1rem;

}

}
.option-btn {
  display: block;
  width: 100%;

  text-align: left;
  background: var(--bg-soft);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-family: inherit;

}
.option-btn:hover:not(:disabled) {

}

}
.option-btn.falsch {
  background: #FFEDD5;

}
.erklaerung-box {
  margin-top: 1.2rem;

  border-left: 4px solid var(--primary);
  border-radius: 8px;
  padding: 0.9rem 1.1rem;

}

.erklaerung-label {

}
.weiter-btn {

}

.ergebnis-karte {

  border: 1px solid var(--border);

}

<script>const QUIZ = [{"frage":"Welche Aussage zur Körpersprache beim Vortragen ist fachlich korrekt?","optionen":["Verschränkte Arme signalisieren Stärke und Selbstsicherheit beim Vortrag","Blickkontakt sollte auf eine einzige Vertrauensperson im Publikum konzentriert werden","Aufrechte Haltung und offene Gestik wirken einladend und kompetent","Hände in den Hosentaschen lenken das Publikum auf den inhaltlichen Kern"],"richtig":2,"erklaerung":"Aufrechte, offene Haltung und unterstützende Gestik fördern den Eindruck von Kompetenz und Präsenz. Verschränkte Arme oder Hände in den Taschen wirken abweisend; Blickkontakt sollte über das gesamte Publikum verteilt werden."},{"frage":"Welche Maßnahme ist die wirksamste Strategie gegen übermäßiges Lampenfieber?","optionen":["Unmittelbar vor dem Vortrag Kaffee trinken, um die Konzentration zu steigern","Den Vortrag vollständig auswendig lernen, damit kein Wort vergessen werden kann","Gründliche inhaltliche Vorbereitung und das Halten eines Probevortrags","Die Beleuchtung im Raum dimmen, um den persönlichen Stresspegel zu senken"],"richtig":2,"erklaerung":"Die wirksamste Strategie gegen Lampenfieber ist gründliche Vorbereitung einschließlich eines Probevortrags. Wer den Stoff sicher beherrscht und den roten Faden kennt, tritt deutlich ruhiger auf."},{"frage":"Welche der folgenden Formulierungen entspricht einer korrekten Ich-Botschaft im Feedback?","optionen":["Ich habe bemerkt, dass Sie während des Vortrags mehrfach auf die Folie geschaut haben","Sie sind offensichtlich schlecht vorbereitet gewesen und wirkten nervös","Man hat deutlich gesehen, dass Ihre Präsentation keinen roten Faden hatte","Das war insgesamt eine schwache Leistung ohne klare Struktur"],"richtig":0,"erklaerung":"Eine Ich-Botschaft formuliert die eigene Wahrnehmung konkret und beschreibend — zum Beispiel: 'Ich habe bemerkt, dass …'. Die anderen Optionen enthalten Urteile über die Person oder unpersönliche Formulierungen wie 'man hat gesehen'."},{"frage":"Welche zeitliche Regel gilt laut den Feedbackregeln für das Geben von Rückmeldungen?","optionen":["Feedback sollte erst nach einer Nacht Bedenkzeit formuliert werden","Feedback ist erst sinnvoll, wenn alle Beteiligten völlig emotionsfrei sind","Feedback soll möglichst zeitnah nach der beobachteten Situation erfolgen","Der optimale Zeitpunkt für Feedback ist der nächste planmäßige Teamtermin"],"richtig":2,"erklaerung":"Feedback soll zeitnah gegeben werden — idealerweise direkt im Anschluss an die Beobachtung. Zu langes Warten lässt Details in Vergessenheit geraten und schwächt die Wirksamkeit der Rückmeldung."},{"frage":"Was unterscheidet die Reflexionsstrategie von der Regulationsstrategie laut Lehrbuch Kap. 1.5.3?","optionen":["Die Reflexionsstrategie zieht Konsequenzen; die Regulationsstrategie hinterfragt die Arbeit","Die Reflexionsstrategie hinterfragt die eigene Arbeit selbstkritisch; die Regulationsstrategie zieht Konsequenzen und behebt Defizite","Reflexion betrifft nur Einzelpersonen; Regulation ist ausschließlich eine Teamaufgabe","Beide Strategien sind identisch — der Begriff wird lediglich je nach Kontext unterschiedlich verwendet"],"richtig":1,"erklaerung":"Laut Lehrbuch (Kap. 1.5.3): Die Reflexionsstrategie bedeutet, die eigene Arbeit selbstständig und selbstkritisch zu hinterfragen und Defizite zu erkennen. Die Regulationsstrategie zieht daraus Konsequenzen — Lösungen erstellen, Lernstrategien anpassen, Zielvereinbarungen treffen."},{"frage":"Welche der folgenden Methoden wird laut Methodensammlung zur Teamreflexion eingesetzt?","optionen":["Blitzlicht, Stimmungsbarometer und Spinnennetz","Stakeholderanalyse und SWOT-Matrix","Brainstorming und Mindmapping zur Ideenfindung","Organigramm und Ablaufdiagramm zur Prozessdarstellung"],"richtig":0,"erklaerung":"Blitzlicht, Stimmungsbarometer und Spinnennetz sind Methoden aus der Methodensammlung, die zur Reflexion der Teamarbeit eingesetzt werden. Das Blitzlicht ermöglicht schnelle Rundrückmeldungen; das Spinnennetz bewertet mehrere Kriterien gleichzeitig auf einer Skala."},{"frage":"Welchen Anteil hat laut Bewertungsschema der fachliche Inhalt an der Beurteilung einer Präsentation?","optionen":["10 %","20 %","30 %","40 %"],"richtig":3,"erklaerung":"Im Bewertungsschema für Präsentationen hat der fachliche Inhalt — Richtigkeit, Vollständigkeit und roter Faden — den höchsten Anteil mit 40 %. Struktur, Medien und Vortragsstil folgen mit je 20 %."},{"frage":"Eine Präsentierende wird während ihres Vortrags von einem Zuhörer mit einer Zwischenfrage unterbrochen. Wie sollte sie laut Vortragstechnik idealerweise reagieren?","optionen":["Die Frage ignorieren und nach dem Vortrag auf Fragen eingehen","Die Frage kurz aufnehmen, ggf. auf den Fragenteil am Ende vertrösten und den roten Faden wieder aufgreifen","Den Vortrag sofort unterbrechen und ausführlich auf alle Aspekte der Frage eingehen","Den Fragesteller bitten, sich bis zur nächsten Veranstaltung zu gedulden"],"richtig":1,"erklaerung":"Bei Zwischenfragen empfiehlt die Vortragstechnik: Frage kurz bestätigen, falls sie zum aktuellen Teil passt knapp beantworten, andernfalls höflich auf den Frageteil am Ende vertrösten und dann zügig zum roten Faden zurückfinden. So bleibt die Struktur des Vortrags erhalten."},{"frage":"Welche Aussage zum Sprechtempo und zum Einsatz von Pausen in einem Vortrag ist fachlich korrekt?","optionen":["Bewusste Pausen nach wichtigen Aussagen wirken souverän und geben dem Publikum Zeit zum Verarbeiten","Ein gleichmäßig hohes Sprechtempo zeigt Kompetenz und hält das Publikum wach","Pausen sollten grundsätzlich vermieden werden, da sie Unsicherheit signalisieren","Das Sprechtempo sollte sich ausschließlich nach dem Tempo der eigenen Folien richten"],"richtig":0,"erklaerung":"Gezielte Pausen nach zentralen Aussagen sind ein wirksames rhetorisches Mittel: Sie verleihen dem Vortrag Struktur, betonen wichtige Inhalte und wirken souverän statt nervös. Monotones Vorlesen oder ein dauerhaft hohes Tempo erschweren das Verständnis und ermüden das Publikum."},{"frage":"Welche Aussage zur Reflexionsmethode 'Blitzlicht' ist korrekt?","optionen":["Beim Blitzlicht bewertet jedes Teammitglied alle anderen Mitglieder schriftlich auf einer Skala","Das Blitzlicht ist eine Methode zur Ideenfindung am Beginn einer Teamarbeit","Beim Blitzlicht erstellt jedes Mitglied ein Netzdiagramm mit mehreren Bewertungskriterien","Das Blitzlicht ist eine Kurzrückmeldungsrunde, in der jede Person kurz ihre Einschätzung oder ihr Stimmungsbild zur Teamarbeit äußert"],"richtig":3,"erklaerung":"Beim Blitzlicht äußert jedes Teammitglied reihum kurz — in ein bis zwei Sätzen — seine aktuelle Einschätzung oder sein Stimmungsbild zur Teamarbeit bzw. zur Lernsituation. Es ist eine schnelle Methode zur Teamreflexion ohne lange Diskussion."},{"frage":"Welche vier Fachrichtungen hat der Fachinformatiker seit der Neuordnung 2020?","optionen":["Anwendungsentwicklung, Systemintegration, Netzwerktechnik und Datenbankadministration","Anwendungsentwicklung, Systemintegration, Digitale Vernetzung und Daten- und Prozessanalyse","Softwareentwicklung, IT-Sicherheit, Cloud-Administration und Datenbankentwicklung","Systemintegration, Digitale Vernetzung, Cybersecurity und künstliche Intelligenz"],"richtig":1,"erklaerung":"Seit der Neuordnung 2020 gliedert sich der Fachinformatiker in vier Fachrichtungen: Anwendungsentwicklung (FIAE), Systemintegration (FISI), Digitale Vernetzung (FIDV) und Daten- und Prozessanalyse (FIDP). Die letzten beiden wurden 2020 neu eingeführt."},{"frage":"Wie werden die Teile der gestreckten Abschlussprüfung für IT-Berufe gewichtet?","optionen":["Teil 1 mit 50 %, Teil 2 mit 50 %","Teil 1 mit 30 %, Teil 2 mit 70 %","Teil 1 mit 10 %, Teil 2 mit 90 %","Teil 1 mit 20 %, Teil 2 mit 80 %"],"richtig":3,"erklaerung":"Teil 1 der gestreckten Abschlussprüfung (nach ca. 15 Monaten, schriftlich) wird mit 20 % gewichtet. Teil 2 zum Ausbildungsende — mit Projektarbeit, Fachgespräch, berufsspezifischen Aufgaben und WISO — hat ein Gewicht von 80 %."},{"frage":"Welche Aussage zur Aufgabe der IHK in der dualen Berufsausbildung ist korrekt?","optionen":["Die IHK erstellt den schulischen Rahmenlehrplan und überwacht die Berufsschulen","Die IHK ist die zuständige Stelle nach BBiG — sie lässt Betriebe zur Ausbildung zu, trägt Verträge ein und nimmt Prüfungen ab","Die IHK ist für die Aufstellung der Stundentafeln an der Berufsschule verantwortlich","Die IHK schließt den Ausbildungsvertrag stellvertretend für den Ausbildungsbetrieb ab"],"richtig":1,"erklaerung":"Die IHK ist die zuständige Stelle nach BBiG: Sie lässt Betriebe zur Ausbildung zu, überwacht die Ausbildungsqualität, trägt Ausbildungsverträge ein und nimmt die Abschlussprüfungen ab. Den Rahmenlehrplan erstellt die Kultusministerkonferenz (KMK)."},{"frage":"Welche Mindest- und Höchstdauer der Probezeit schreibt § 20 BBiG für Berufsausbildungsverhältnisse vor?","optionen":["Mindestens 2 Wochen, höchstens 3 Monate","Mindestens 1 Monat, höchstens 4 Monate","Mindestens 2 Monate, höchstens 6 Monate","Mindestens 1 Woche, höchstens 2 Monate"],"richtig":1,"erklaerung":"§ 20 BBiG legt fest: Die Probezeit beträgt mindestens 1 Monat und höchstens 4 Monate. In dieser Zeit kann das Ausbildungsverhältnis von beiden Seiten jederzeit ohne Frist und ohne Angabe von Gründen beendet werden."},{"frage":"Wie viele Urlaubstage stehen einem Auszubildenden zu, der bei Ausbildungsbeginn 15 Jahre alt ist, nach § 19 JArbSchG?","optionen":["25 Tage","20 Tage","27 Tage","30 Tage"],"richtig":3,"erklaerung":"Nach § 19 JArbSchG gilt: unter 16 Jahre → mindestens 30 Urlaubstage; unter 17 Jahre → mindestens 27 Tage; unter 18 Jahre → mindestens 25 Tage. Ein 15-Jähriger fällt in die Gruppe 'unter 16 Jahre' und hat Anspruch auf mindestens 30 Tage."},{"frage":"Welche Institution koordiniert und verabschiedet den Rahmenlehrplan für den schulischen Unterricht in Berufsschulen?","optionen":["Das Bundesbildungsministerium (BMBF) einheitlich für alle Bundesländer","Die Kultusministerkonferenz (KMK) als gemeinsames Gremium der Bundesländer","Die IHK als zuständige Stelle nach BBiG","Das Bundesinstitut für Berufsbildung (BIBB) für alle Berufsschulen"],"richtig":1,"erklaerung":"Die Kultusministerkonferenz (KMK) koordiniert und verabschiedet die Rahmenlehrpläne für den schulischen Teil der dualen Berufsausbildung. Das BIBB ist für die Ausbildungsordnungen (betrieblicher Teil) zuständig. Die Schulaufsicht liegt bei den Landesbehörden."},{"frage":"Was ist die JAV und auf welcher gesetzlichen Grundlage ist sie tätig?","optionen":["Die Jugend-Ausbildungs-Vereinigung — ein freiwilliger Zusammenschluss ohne gesetzliche Grundlage","Die Jugend- und Auszubildendenvertretung — die gewählte Interessenvertretung nach §§ 60 ff. BetrVG","Ein Beratungsgremium der IHK für jugendliche Auszubildende im Betrieb","Die Jugendabteilung der Gewerkschaft — zuständig nach § 17 BBiG"],"richtig":1,"erklaerung":"Die JAV (Jugend- und Auszubildendenvertretung) ist die gesetzlich vorgesehene Interessenvertretung aller Jugendlichen und Auszubildenden im Betrieb, geregelt in §§ 60 ff. BetrVG. Sie wird gewählt in Betrieben mit Betriebsrat und in der Regel mindestens fünf Jugendlichen oder Auszubildenden unter 25 Jahren. Sie leitet Vorschläge und Beschwerden über den Betriebsrat an den Arbeitgeber weiter."},{"frage":"Wie viele Mitarbeiterinnen und Mitarbeiter sowie Auszubildende gibt es am Hamburger Standort von JIKU IT-Solutions?","optionen":["52 Mitarbeiter und 8 Auszubildende","48 Mitarbeiter und 10 Auszubildende","32 Mitarbeiter und 12 Auszubildende","16 Mitarbeiter und 4 Auszubildende"],"richtig":0,"erklaerung":"Am Hamburger Standort von JIKU IT-Solutions arbeiten 52 Mitarbeiterinnen und Mitarbeiter, darunter 8 Auszubildende. Im gesamten Verbund aus zehn Systemhäusern sind es 480 Mitarbeiter und 96 Auszubildende."},{"frage":"Was besagt § 17 HGB zur Firma eines Kaufmanns?","optionen":["Die Firma bezeichnet das gesamte Unternehmen einschließlich seiner Vermögenswerte","Die Firma bezeichnet die Rechtsform, unter der ein Unternehmen betrieben wird","Die Firma ist der Name, unter dem ein Kaufmann seine Geschäfte betreibt","Als Firma gilt lediglich der im Handelsregister eingetragene Unternehmenszweck"],"richtig":2,"erklaerung":"§ 17 HGB definiert: 'Die Firma eines Kaufmanns ist der Name, unter dem er seine Geschäfte betreibt.' Die Firma ist also der Handelsname — nicht das Unternehmen selbst. 'JIKU IT-Solutions' ist die Firma; die GmbH dahinter ist das Unternehmen."},{"frage":"Welches Mindestkapital schreibt § 7 AktG für die Gründung einer Aktiengesellschaft vor?","optionen":["25.000 €","10.000 €","100.000 €","50.000 €"],"richtig":3,"erklaerung":"§ 7 AktG schreibt für die Aktiengesellschaft ein Mindestgrundkapital von 50.000 € vor. Zum Vergleich: GmbH mindestens 25.000 € (§ 5 GmbHG), UG ab 1 € Stammkapital."},{"frage":"Wie haften Gesellschafter einer OHG gegenüber Gläubigern für Verbindlichkeiten der Gesellschaft?","optionen":["Nur die OHG als juristische Person haftet — die Gesellschafter sind geschützt","Jeder Gesellschafter persönlich, unbeschränkt und solidarisch mit seinem gesamten Vermögen","Nur der Gesellschafter mit dem größten Kapitalanteil haftet vollständig","Die OHG haftet wie eine GmbH nur bis zur Höhe des eingezahlten Stammkapitals"],"richtig":1,"erklaerung":"Bei der OHG haften alle Gesellschafter persönlich, unbeschränkt und gesamtschuldnerisch (solidarisch) mit ihrem gesamten Privatvermögen. Es gibt kein Mindestkapital und keine Haftungsbeschränkung — der wesentliche Unterschied zur GmbH."},{"frage":"Was kennzeichnet die Thesaurierungspflicht der UG (haftungsbeschränkt)?","optionen":["Die UG muss zwingend als GmbH ins Handelsregister eingetragen werden, bevor sie thesaurieren darf","Die UG muss 50 % ihres Jahresumsatzes als Rücklage einbehalten","Die gesamten Jahresgewinne müssen solange einbehalten werden, bis 50.000 € Stammkapital erreicht sind","25 % des Jahresüberschusses müssen als gesetzliche Rücklage einbehalten werden, bis 25.000 € Stammkapital erreicht sind"],"richtig":3,"erklaerung":"Bei der UG (haftungsbeschränkt) müssen 25 % des Jahresüberschusses als gesetzliche Rücklage einbehalten werden, bis das Stammkapital 25.000 € erreicht hat. Danach kann die UG in eine reguläre GmbH umgewandelt werden."},{"frage":"Ein Unternehmen verfolgt gleichzeitig das Ziel, seinen Marktanteil zu steigern, und das Ziel, die Gesamtkosten zu senken. In welchem Verhältnis stehen diese Ziele typischerweise zueinander?","optionen":["Komplementär — sie verstärken sich gegenseitig und sind problemlos vereinbar","Indifferent — sie beeinflussen sich gegenseitig nicht","Konkurrierend — Marktanteilsausbau erfordert typischerweise höhere Ausgaben, was Kostensenkung erschwert","Identisch — beide Ziele beschreiben denselben wirtschaftlichen Sachverhalt"],"richtig":2,"erklaerung":"Marktanteilssteigerung (z. B. durch mehr Marketing oder niedrigere Preise) und Kostensenkung stehen häufig in einem konkurrierenden (konfliktären) Verhältnis. Das eine Ziel erschwert das Erreichen des anderen — es sei denn, Effizienzgewinne erlauben beides gleichzeitig."},{"frage":"Welches Dokument legt die sachliche und zeitliche Gliederung der Ausbildung betriebsindividuell fest und ist Anlage zum Ausbildungsvertrag?","optionen":["Der Ausbildungsplan","Der Rahmenlehrplan der Kultusministerkonferenz","Die Ausbildungsordnung des BIBB","Das Berufsbildungsgesetz (BBiG)"],"richtig":0,"erklaerung":"Der Ausbildungsplan ist die betriebsindividuelle Konkretisierung der Ausbildungsordnung: Er legt sachlich und zeitlich fest, wann welche Inhalte im Betrieb vermittelt werden. Er ist als Anlage Bestandteil des Berufsausbildungsvertrags."},{"frage":"Was sind die drei Elementarfaktoren nach Erich Gutenbergs betriebswirtschaftlichem Modell?","optionen":["Ausführende Arbeit, Betriebsmittel und Werkstoffe","Arbeit, Boden und Kapital","Management, Maschinen und Rohstoffe","Planung, Organisation und Kontrolle"],"richtig":0,"erklaerung":"Gutenberg unterschied Elementarfaktoren und den dispositiven Faktor. Die drei Elementarfaktoren sind: ausführende Arbeit (operative Tätigkeiten ohne Leitungsanteil), Betriebsmittel (Gebäude, Maschinen, Server) und Werkstoffe (Rohstoffe, Hilfsstoffe, Betriebsstoffe, Fertigteile)."},{"frage":"JIKU Hamburg erwirtschaftet 5,4 Mio. € Umsatz, hat Vorleistungen von 2,1 Mio. € und Abschreibungen von 0,5 Mio. €. Wie hoch ist die Wertschöpfung?","optionen":["3,3 Mio. €","2,8 Mio. €","4,9 Mio. €","5,4 Mio. €"],"richtig":1,"erklaerung":"Wertschöpfung = Umsatzerlöse − Vorleistungen − Abschreibungen = 5.400.000 € − 2.100.000 € − 500.000 € = 2.800.000 €."},{"frage":"Was kennzeichnet das Angebotsoligopol als Marktform?","optionen":["Genau ein Anbieter steht vielen Nachfragern gegenüber","Viele Anbieter stehen einem einzigen Nachfrager gegenüber","Wenige Anbieter stehen vielen Nachfragern gegenüber und beobachten sich gegenseitig","Genau zwei Anbieter und zwei Nachfrager teilen sich den Markt"],"richtig":2,"erklaerung":"Das Angebotsoligopol ist durch wenige Anbieter und viele Nachfrager gekennzeichnet. Die wenigen Anbieter beobachten einander und reagieren strategisch aufeinander. Beispiele: Chipmarkt (Intel, AMD, Qualcomm), Smartphone-Betriebssysteme, Cloud-Infrastruktur."},{"frage":"Was geschieht auf einem Markt, wenn der aktuelle Preis über dem Gleichgewichtspreis liegt?","optionen":["Es entsteht ein Nachfrageüberhang — mehr wird nachgefragt als angeboten, der Preis steigt weiter","Es entsteht ein Angebotsüberhang — mehr wird angeboten als nachgefragt, der Preis sinkt tendenziell","Angebot und Nachfrage gleichen sich sofort vollständig aus, der Preis bleibt konstant","Die Angebotsmenge sinkt, weil Produzenten ihre Produktion automatisch einschränken"],"richtig":1,"erklaerung":"Liegt der Marktpreis über dem Gleichgewichtspreis, entsteht ein Angebotsüberhang (Käufermarkt): Es wird mehr produziert und angeboten als nachgefragt. Infolgedessen sinkt der Preis tendenziell, bis sich ein neues Gleichgewicht einstellt."},{"frage":"Was versteht man unter einem Lock-in-Effekt in IT-Märkten?","optionen":["Eine gesetzliche Preisbindung für IT-Produkte, die Preisabsprachen verhindert","Ein Sicherheitsmechanismus, der unbefugten Zugriff auf IT-Systeme blockiert","Die Bindung von Kunden an einen Anbieter durch hohe Wechselkosten oder technische Abhängigkeiten","Die technische Sperre, die verhindert, dass Wettbewerber in einen neuen Markt eintreten"],"richtig":2,"erklaerung":"Lock-in-Effekte entstehen, wenn Kunden durch technische Abhängigkeiten, hohe Wechselkosten oder proprietäre Standards an einen Anbieter gebunden werden. Beispiele: proprietäre Cloud-APIs (AWS), geschlossene App-Ökosysteme (Apple iOS), herstellerspezifische Dateiformate."},{"frage":"Welche Funktion übernehmen Banken im erweiterten Wirtschaftskreislauf?","optionen":["Banken treten ausschließlich als Nachfrager auf dem Gütermarkt auf","Banken sammeln Ersparnisse der Haushalte und leiten sie als Kredite an Unternehmen und Haushalte weiter","Banken erheben Steuern im Auftrag des Staates und verteilen Transferleistungen","Banken sind im erweiterten Kreislauf ausschließlich für den internationalen Güterhandel zuständig"],"richtig":1,"erklaerung":"Im erweiterten Wirtschaftskreislauf sind Banken als Finanzintermediäre tätig: Sie sammeln Ersparnisse der Haushalte (Einlagen) und leiten diese als Kredite an Unternehmen (für Investitionen) und Haushalte (für Konsum oder Immobilienkauf) weiter."},{"frage":"Welche Güterbeziehung besteht zwischen Druckerpapier (Verbrauchsgut) und dem Drucker (Betriebsmittel)?","optionen":["Komplementärgüter — sie ergänzen sich und werden gemeinsam genutzt","Substitutionsgüter — sie können sich gegenseitig ersetzen","Unabhängige Güter — sie haben keinerlei wirtschaftliche Beziehung zueinander","Freie Güter — beide stehen unbegrenzt und kostenlos zur Verfügung"],"richtig":0,"erklaerung":"Drucker und Druckerpapier sind Komplementärgüter: Sie ergänzen sich gegenseitig und werden gemeinsam genutzt. Steigt die Nachfrage nach einem Komplementärgut (z. B. Drucker), steigt in der Regel auch die Nachfrage nach dem anderen (Druckerpapier)."},{"frage":"Ein 16-jähriger Auszubildender soll an einem Freitag 9 Stunden im Betrieb einspringen. Ist das nach dem JArbSchG zulässig?","optionen":["Ja, in Ausnahmefällen darf die tägliche Arbeitszeit für Jugendliche auf bis zu 10 Stunden ausgedehnt werden","Nein, das JArbSchG erlaubt Jugendlichen täglich maximal 8 Stunden Beschäftigung","Ja, weil die wöchentliche Grenze von 40 Stunden noch nicht erreicht wurde","Ja, die 8-Stunden-Regelung gilt nach dem JArbSchG nur für Unter-15-Jährige"],"richtig":1,"erklaerung":"§ 8 JArbSchG setzt die tägliche Höchstarbeitszeit für Jugendliche (unter 18 Jahre) auf 8 Stunden fest. 9 Stunden überschreiten diese Grenze unzulässig — auch wenn die Wochengrenze noch nicht ausgeschöpft ist. Ausnahmen sind eng begrenzt."},{"frage":"JIKU beauftragt einen Subunternehmer mit der Verlegung von Glasfaserkabeln für ein Kundenprojekt. Wie ist diese externe Leistung in der Wertschöpfungsrechnung von JIKU einzuordnen?","optionen":["Als Wertschöpfung, weil JIKU die Leistung gegenüber dem Kunden erbringt","Als Vorleistung, weil die Leistung extern bezogen wird und vom Umsatz abgezogen werden muss","Weder als Vorleistung noch als Wertschöpfung — externe Leistungen werden nicht berücksichtigt","Als Vorleistung nur dann, wenn der Subunternehmer mehr als die Hälfte der Gesamtleistung erbringt"],"richtig":1,"erklaerung":"Bezogene Fremdleistungen — Leistungen, die ein Unternehmen von Dritten einkauft — zählen zu den Vorleistungen. Sie werden bei der Wertschöpfungsberechnung vom Umsatz abgezogen: Wertschöpfung = Umsatz − Vorleistungen − Abschreibungen."},{"frage":"Welche der folgenden Tätigkeiten bei JIKU ist eindeutig ein Kernprozess (Wertschöpfungsprozess)?","optionen":["Aufbau und Inbetriebnahme eines Netzwerks beim Kunden vor Ort","Monatliche Gehaltsabrechnung für die eigenen JIKU-Mitarbeiter","Buchhalterische Erfassung eingehender Lieferantenrechnungen","Pflege des internen JIKU-Firmennetzwerks und der eigenen Server"],"richtig":0,"erklaerung":"Kernprozesse sind direkt auf den Kunden ausgerichtete Leistungen, die unmittelbar Wertschöpfung erzeugen. Der Aufbau eines Netzwerks beim Kunden ist ein typischer Kernprozess bei JIKU. Lohnabrechnung, Buchhaltung und interner IT-Betrieb sind Supportprozesse."},{"frage":"Stellen Sie sich vor: JIKU organisiert sein IT-Solutions-Team künftig sowohl nach Kundengruppen (Business, Public, Consumer) als auch nach Technologiebereichen (Cloud, Netzwerk, Security). Welche Organisationsform liegt vor?","optionen":["Einliniensystem, weil jede Stelle genau einen klaren Vorgesetzten hat","Stablinienorganisation, weil beratende Stabsstellen eingesetzt werden","Matrixorganisation, weil Mitarbeiter gleichzeitig zwei Weisungslinien unterstehen","Mehrliniensystem, weil mehrere Instanzen Weisungen erteilen, aber ohne Schnittmengen"],"richtig":2,"erklaerung":"Die Matrixorganisation kombiniert zwei Gliederungsprinzipien (z. B. Kundengruppe und Technologiebereich), sodass Mitarbeiter gleichzeitig zwei Vorgesetzten unterstehen. Vorteil: Flexibilität und Spezialisierung; Nachteil: mögliche Kompetenzstreitigkeiten und Doppelzuständigkeiten."},{"frage":"Eine Softwarefirma mit 180 Mitarbeitern erzielt 12 Mio. € Umsatz, hat 4,5 Mio. € Vorleistungen und 0,8 Mio. € Abschreibungen. Welche Aussagen sind vollständig korrekt?","optionen":["Wertschöpfung = 7,5 Mio. €; Wertschöpfung je Mitarbeiter = 41.667 €; Marktform: Monopol","Wertschöpfung = 6,7 Mio. €; Wertschöpfung je Mitarbeiter = 37.222 €; Sektor: sekundärer Sektor","Wertschöpfung = 6,7 Mio. €; Wertschöpfung je Mitarbeiter ca. 37.222 €; Sektor: tertiärer Sektor","Wertschöpfung = 7,5 Mio. €; Wertschöpfung je Mitarbeiter = 41.667 €; Sektor: tertiärer Sektor"],"richtig":2,"erklaerung":"Wertschöpfung = 12.000.000 € − 4.500.000 € − 800.000 € = 6.700.000 €. Wertschöpfung je Mitarbeiter = 6.700.000 € ÷ 180 = ca. 37.222 €. Eine Softwarefirma ist ein Dienstleistungsunternehmen und gehört zum tertiären Sektor."},{"frage":"Welche Aussage erklärt korrekt, warum Netzwerkeffekte in IT-Märkten zu Monopoltendenzen führen können?","optionen":["Netzwerkeffekte beschreiben gesetzliche Preisbindungsregeln für digitale Plattformen","Netzwerkeffekte senken die Produktionskosten und machen Monopole langfristig unwirtschaftlich","Netzwerkeffekte entstehen nur bei physischen Gütern, nicht bei digitalen Plattformen","Der Nutzen einer Plattform wächst mit der Nutzerzahl — die größte Plattform zieht immer mehr Nutzer an"],"richtig":3,"erklaerung":"Netzwerkeffekte entstehen, wenn der Nutzen eines Produkts mit der Anzahl der Nutzer wächst (z. B. soziale Netzwerke, Marktplätze, Betriebssysteme). Das führt zum 'Winner-takes-all'-Effekt: Die größte Plattform zieht immer mehr Nutzer an und verdrängt kleinere Anbieter, was zur Monopolisierung führt."},{"frage":"Welches Lernfeld hat im Curriculum der IT-Berufe das Thema 'Das Unternehmen und die eigene Rolle im Betrieb beschreiben'?","optionen":["Lernfeld 1","Lernfeld 2","Lernfeld 5","Lernfeld 6"],"richtig":0,"erklaerung":"Lernfeld 1 hat als Titel 'Das Unternehmen und die eigene Rolle im Betrieb beschreiben'. Es behandelt IT-Berufe, duales System, Ausbildungsrecht, Betriebsstrukturen, Rechtsformen, Wertschöpfung und Märkte — der gesamte Stoff dieses Kurses."},{"frage":"Was ist der dispositive Faktor in Gutenbergs betriebswirtschaftlichem Produktionsfaktormodell?","optionen":["Die ausführende Arbeitskraft auf operativer Ebene ohne Leitungsfunktion","Rohstoffe und Hilfsstoffe, die in den betrieblichen Produktionsprozess eingehen","Die Geschäftsleitung mit den Aufgaben Leiten, Planen, Organisieren und Kontrollieren","Maschinen, Server und Betriebsgebäude als technische Ausstattung des Betriebs"],"richtig":2,"erklaerung":"Der dispositive Faktor nach Gutenberg umfasst die Geschäftsführung mit den Kernaufgaben: Leiten, Planen, Organisieren und Kontrollieren. Er koordiniert die drei Elementarfaktoren und steuert das gesamte betriebliche Geschehen."},{"frage":"Welche der vier folgenden Aussagen ist eine vollständig korrekte Zusammenfassung des Lernfeld-1-Stoffs?","optionen":["Seit 2020 gibt es drei IT-Berufe; die Probezeit beträgt maximal 6 Monate; GmbH-Mindestkapital ist 50.000 €","Die Wertschöpfung berechnet sich als Umsatz plus Vorleistungen plus Abschreibungen","Im Angebotsoligopol stehen viele Anbieter wenigen Nachfragern gegenüber","Seit 2020 gibt es vier IT-Berufe; Probezeit maximal 4 Monate; Wertschöpfung = Umsatz − Vorleistungen − Abschreibungen"],"richtig":3,"erklaerung":"Die vollständig korrekte Zusammenfassung: Seit 2020 gibt es vier IT-Berufe (Fachinformatiker mit 4 Fachrichtungen, IT-Systemelektroniker, Kfm. IT-System-Management, Kfm. Digitalisierungsmanagement); die Probezeit beträgt mindestens 1 und höchstens 4 Monate (§ 20 BBiG); Wertschöpfung = Umsatzerlöse − Vorleistungen − Abschreibungen."}];

(function() {
  var fragen = [];
  var aktuell = 0;
  var richtigCount = 0;
  var app = document.getElementById('app');

  function mischen(arr) {
    // Fisher-Yates in-place
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function fragenVorbereiten() {
    // Kopie der Original-Fragen
    var kopie = QUIZ.map(function(f) { return Object.assign({}, f, { optionen: f.optionen.slice() }); });
    mischen(kopie);

    fragen = kopie.map(function(f) {
      // Optionen mischen, korrekten Index mitführen
      var n = f.optionen.length;
      var indizes = [];
      for (var k = 0; k < n; k++) indizes.push(k);
      // Fisher-Yates auf Indizes
      for (var i = n - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = indizes[i]; indizes[i] = indizes[j]; indizes[j] = tmp;
      }
      // neues Optionen-Array in gemischter Reihenfolge
      var gemischteOptionen = indizes.map(function(idx) { return f.optionen[idx]; });
      // neuer Index der richtigen Antwort
      var neuerRichtig = indizes.indexOf(f.richtig);
      return {
        frage: f.frage,
        optionen: gemischteOptionen,
        richtig: neuerRichtig,
        erklaerung: f.erklaerung
      };
    });
  }

  function start() {
    aktuell = 0;
    richtigCount = 0;
    fragenVorbereiten();
    zeigeFrage();
  }

  function zeigeFrage() {
    if (aktuell >= fragen.length) {
      zeigeErgebnis();
      return;
    }
    var f = fragen[aktuell];
    var prozent = Math.round((aktuell / fragen.length) * 100);

    var html = '<div class="fortschritt-wrap">'
      + '<div class="fortschritt-label">Frage ' + (aktuell + 1) + ' von ' + fragen.length + '</div>'
      + '<div class="fortschritt-bar"><div class="fortschritt-fill" style="width:' + prozent + '%"></div></div>'
      + '</div>'
      + '<div class="karte">'
      + '<div class="frage-text">' + escHtml(f.frage) + '</div>'
      + '<div class="optionen">';

    f.optionen.forEach(function(opt, idx) {
      html += '<button class="option-btn" data-idx="' + idx + '">' + escHtml(opt) + '</button>';
    });

    html += '</div>'
      + '<div class="erklaerung-box" id="erklaerung">'
      + '<div class="erklaerung-label">Erklärung</div>'
      + '<div id="erklaerung-text"></div>'
      + '</div>'
      + '<button class="weiter-btn" id="weiter-btn">'
      + (aktuell + 1 < fragen.length ? 'Weiter →' : 'Auswertung')
      + '</button>'
      + '</div>';

    app.innerHTML = html;

    // Event-Listener auf Buttons
    var btns = app.querySelectorAll('.option-btn');
    btns.forEach(function(btn) {
      btn.addEventListener('click', function() {
        var gewaehlt = parseInt(btn.getAttribute('data-idx'));
        antwortenVerarbeiten(gewaehlt, btns);
      });
    });

    document.getElementById('weiter-btn').addEventListener('click', function() {
      aktuell++;
      zeigeFrage();
    });
  }

  function antwortenVerarbeiten(gewaehlt, btns) {
    var f = fragen[aktuell];
    var richtigIdx = f.richtig;

    // Alle Buttons deaktivieren
    btns.forEach(function(b) { b.disabled = true; });

    // Gewählte Option einfärben
    if (gewaehlt === richtigIdx) {
      btns[gewaehlt].classList.add('richtig');
      richtigCount++;
    } else {
      btns[gewaehlt].classList.add('falsch');
      btns[richtigIdx].classList.add('richtig');
    }

    // Erklärung anzeigen
    var erkBox = document.getElementById('erklaerung');
    var erkText = document.getElementById('erklaerung-text');
    erkText.textContent = f.erklaerung;
    erkBox.classList.add('sichtbar');

    // Weiter-Button anzeigen
    document.getElementById('weiter-btn').classList.add('sichtbar');
  }

  function zeigeErgebnis() {
    var gesamt = fragen.length;
    var prozent = Math.round((richtigCount / gesamt) * 100);
    var bewertung = prozent >= 80 ? '🎉 Sehr gut!' : prozent >= 60 ? '👍 Gut gemacht!' : '💪 Weiter üben!';

    app.innerHTML = '<div class="ergebnis-karte">'
      + '<h2>Auswertung</h2>'
      + '<div class="ergebnis-punkte">' + richtigCount + ' / ' + gesamt + '</div>'
      + '<div class="ergebnis-prozent">' + prozent + ' % richtig — ' + bewertung + '</div>'
      + '<button class="nochmal-btn" id="nochmal-btn">Nochmal</button>'
      + '</div>';

    document.getElementById('nochmal-btn').addEventListener('click', start);
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  start();
})();
</script></body></html>
